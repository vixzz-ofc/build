name: "VxzWorker Build"

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "ZIP URL"
        required: true
      tag:
        description: "Build Tag"
        required: true
      build_type:
        description: "debug / release"
        required: true
        default: "release"
      press_apk:
        description: "Compress APK (true/false)"
        required: false
        default: "true"
      pat_token:
        description: "Auth token"
        required: false
        default: ""

concurrency:
  group: vxz-android-${{ github.event.inputs.tag }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GRADLE_USER_HOME: /opt/gradle-home
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=false
        -Dorg.gradle.parallel=true
        -Dorg.gradle.caching=true
        -Dorg.gradle.configureondemand=true
        -Dorg.gradle.workers.max=4
        -Dorg.gradle.jvmargs=-Xmx2500m
        -XX:+UseParallelGC
        -XX:MaxMetaspaceSize=512m
        -Dkotlin.incremental=false
        -Dkotlin.parallel.tasks.in.project=true
        -Dkapt.use.worker.api=true
        -Dorg.gradle.warning.mode=none
      JAVA_OPTS: "-Xmx2500m -XX:+UseParallelGC"

    steps:

      - name: "[VxzWorker] Init"
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  VxzWorker Build System"
          echo "  Tag     : ${{ github.event.inputs.tag }}"
          echo "  Mode    : ${{ github.event.inputs.build_type }}"
          echo "  Time    : $(date '+%Y-%m-%d %H:%M:%S UTC')"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "WORKER_ID=VxzWorker-$(( (RANDOM % 5) + 1 ))" >> $GITHUB_ENV
          echo "BUILD_START=$(date +%s)" >> $GITHUB_ENV

      - name: "[VxzWorker] Setup Java"
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: "[VxzWorker] Cache Gradle"
        uses: actions/cache@v4
        with:
          path: |
            /opt/gradle-home/caches
            /opt/gradle-home/wrapper
          key: gradle-android-linux-v6
          restore-keys: gradle-android-linux-v6

      - name: "[VxzWorker] Download"
        timeout-minutes: 3
        env:
          ZIP_URL: ${{ github.event.inputs.zip_url }}
          INPUT_TOKEN: ${{ github.event.inputs.pat_token }}
          SECRET_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -eo pipefail
          TOKEN="${INPUT_TOKEN:-${SECRET_TOKEN:-}}"
          echo "[ .. ] Fetching project archive..."
          _dl() {
            ARGS="-fLsS -o /tmp/project.zip -w %{http_code} -H Accept:application/octet-stream --connect-timeout 15 --max-time 90"
            [ -n "$TOKEN" ] && ARGS="$ARGS -H Authorization:Bearer $TOKEN"
            curl $ARGS "$ZIP_URL"
          }
          for i in 1 2 3 4 5; do
            CODE=$(_dl 2>/dev/null || echo 000)
            [ "$CODE" = "200" ] || [ "$CODE" = "302" ] && break
            [ "$i" = "5" ] && { echo "[FAIL] Download failed HTTP $CODE"; exit 1; }
            sleep 3
          done
          file /tmp/project.zip | grep -qi zip || { echo "[FAIL] Invalid archive"; exit 1; }
          SIZE=$(du -sh /tmp/project.zip | cut -f1)
          echo "[ OK ] Archive $SIZE received"

      - name: "[VxzWorker] Extract"
        run: |
          set -eo pipefail
          mkdir -p project_raw
          unzip -q /tmp/project.zip -d project_raw
          rm -f /tmp/project.zip
          D=$(find project_raw -mindepth 1 -maxdepth 1 -type d | wc -l)
          F=$(find project_raw -mindepth 1 -maxdepth 1 -type f | wc -l)
          [ "$D" -eq 1 ] && [ "$F" -eq 0 ]             && ROOT=$(find project_raw -mindepth 1 -maxdepth 1 -type d | head -1)             || ROOT="project_raw"
          echo "PROJECT_DIR=${ROOT%/}" >> $GITHUB_ENV
          echo "[ OK ] Project extracted: ${ROOT%/}"

      - name: "[VxzWorker] Patch Gradle"
        run: |
          set -eo pipefail
          ANDROID_DIR="$PROJECT_DIR"
          [ -d "$PROJECT_DIR/android" ] && ANDROID_DIR="$PROJECT_DIR/android"
          [ ! -d "$ANDROID_DIR" ] && { echo "[ -- ] No android dir, skip"; exit 0; }

          TARGET_KOTLIN="2.2.20"
          TARGET_GRADLE="9.1.0"
          TARGET_AGP="9.0.1"

          echo "[ .. ] Patching Kotlin/Gradle/AGP..."

          WRAPPER="$ANDROID_DIR/gradle/wrapper/gradle-wrapper.properties"
          [ -f "$WRAPPER" ] && sed -i "s|distributionUrl=.*|distributionUrl=https\://services.gradle.org/distributions/gradle-${TARGET_GRADLE}-bin.zip|g" "$WRAPPER"

          for F in "$ANDROID_DIR/settings.gradle" "$ANDROID_DIR/settings.gradle.kts"; do
            [ ! -f "$F" ] && continue
            sed -i -E 's/(id\s*\(?\s*"com\.android\.application"\s*\)?\s*version\s*)["'"'"'][0-9.]+["'"'"']/\1"'"'"'$TARGET_AGP'"'"'"/g' "$F"
            sed -i -E "s/(id\s*\(?\s*'com\.android\.application'\s*\)?\s*version\s*)[\"'][0-9.]+[\"']/\1\"${TARGET_AGP}\"/g" "$F"
            sed -i -E 's/(id\s*\(?\s*"org\.jetbrains\.kotlin\.android"\s*\)?\s*version\s*)["'"'"'][0-9.]+["'"'"']/\1"'"'"'$TARGET_KOTLIN'"'"'"/g' "$F"
            sed -i -E "s/(id\s*\(?\s*'org\.jetbrains\.kotlin\.android'\s*\)?\s*version\s*)[\"'][0-9.]+[\"']/\1\"${TARGET_KOTLIN}\"/g" "$F"
          done

          for F in "$ANDROID_DIR/build.gradle" "$ANDROID_DIR/build.gradle.kts"; do
            [ ! -f "$F" ] && continue
            sed -i "s|classpath[[:space:]]*'com\.android\.tools\.build:gradle:[0-9.]*'|classpath 'com.android.tools.build:gradle:${TARGET_AGP}'|g" "$F"
            sed -i "s|classpath[[:space:]]*\"com\.android\.tools\.build:gradle:[0-9.]*\"|classpath \"com.android.tools.build:gradle:${TARGET_AGP}\"|g" "$F"
            sed -i "s|classpath[[:space:]]*'org\.jetbrains\.kotlin:kotlin-gradle-plugin:[0-9.]*'|classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:${TARGET_KOTLIN}'|g" "$F"
            sed -i "s|classpath[[:space:]]*\"org\.jetbrains\.kotlin:kotlin-gradle-plugin:[0-9.]*\"|classpath \"org.jetbrains.kotlin:kotlin-gradle-plugin:${TARGET_KOTLIN}\"|g" "$F"
            sed -i -E 's/(id\s*\(?\s*"org\.jetbrains\.kotlin\.android"\s*\)?\s*version\s*)["'"'"'][0-9.]+["'"'"']/\1"'"'"'$TARGET_KOTLIN'"'"'"/g' "$F"
            sed -i "s|ext\.kotlin_version[[:space:]]*=[[:space:]]*'[0-9.]*'|ext.kotlin_version = '${TARGET_KOTLIN}'|g" "$F"
            sed -i "s|ext\.kotlin_version[[:space:]]*=[[:space:]]*\"[0-9.]*\"|ext.kotlin_version = \"${TARGET_KOTLIN}\"|g" "$F"
          done

          for F in "$ANDROID_DIR/app/build.gradle" "$ANDROID_DIR/app/build.gradle.kts"; do
            [ ! -f "$F" ] && continue
            sed -i -E 's/(id\s*\(?\s*"org\.jetbrains\.kotlin\.android"\s*\)?\s*version\s*)["'"'"'][0-9.]+["'"'"']/\1"'"'"'$TARGET_KOTLIN'"'"'"/g' "$F"
            sed -i "s|ext\.kotlin_version[[:space:]]*=[[:space:]]*'[0-9.]*'|ext.kotlin_version = '${TARGET_KOTLIN}'|g" "$F"
            sed -i "s|ext\.kotlin_version[[:space:]]*=[[:space:]]*\"[0-9.]*\"|ext.kotlin_version = \"${TARGET_KOTLIN}\"|g" "$F"
            if ! grep -q "namespace" "$F" 2>/dev/null; then
              APP_ID=$(awk -F'"' '/applicationId/ && !/\/\// { print $2; exit }' "$F" || true)
              [ -n "$APP_ID" ] && sed -i "/android[[:space:]]*{/a\    namespace \"$APP_ID\"" "$F"
            fi
            CUR=$(awk '/compileSdk[^V]|compileSdkVersion/ { for(i=1;i<=NF;i++) if($i~/^[0-9]+$/) { print $i+0; exit } }' "$F" || true)
            [ -n "$CUR" ] && [ "$CUR" -gt 0 ] && [ "$CUR" -lt 35 ]               && sed -i -E "s/compileSdk(Version)?[[:space:]]*[=]?[[:space:]]*[0-9]+/compileSdk 35/g" "$F"
            CUR=$(awk '/minSdkVersion|minSdk[^V]/ { for(i=1;i<=NF;i++) if($i~/^[0-9]+$/) { print $i+0; exit } }' "$F" || true)
            [ -n "$CUR" ] && [ "$CUR" -gt 0 ] && [ "$CUR" -lt 21 ]               && sed -i -E "s/minSdk(Version)?[[:space:]]*[=]?[[:space:]]*[0-9]+/minSdkVersion 21/g" "$F"
          done

          GPROPS="$ANDROID_DIR/gradle.properties"
          [ ! -f "$GPROPS" ] && touch "$GPROPS"
          grep -q "android.useAndroidX"    "$GPROPS" || echo "android.useAndroidX=true"    >> "$GPROPS"
          grep -q "android.enableJetifier" "$GPROPS" || echo "android.enableJetifier=true" >> "$GPROPS"
          grep -q "org.gradle.jvmargs"     "$GPROPS" || echo "org.gradle.jvmargs=-Xmx2048m -XX:+UseParallelGC" >> "$GPROPS"

          echo "[ OK ] Gradle ${TARGET_GRADLE} / AGP ${TARGET_AGP} / Kotlin ${TARGET_KOTLIN}"

      - name: "[VxzWorker] Build"
        timeout-minutes: 10
        run: |
          set -eo pipefail
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          T0=$(date +%s)
          GP=$(find "$PROJECT_DIR" -name "gradlew" ! -path "*/.gradle/*" ! -path "*/build/*" | sort | head -1)
          [ -z "$GP" ] && { echo "[FAIL] gradlew not found"; exit 1; }
          GD=$(dirname "$GP"); chmod +x "$GP"
          echo "sdk.dir=$ANDROID_HOME" > "$GD/local.properties"
          [ ! -f "$GD/gradle.properties" ] && touch "$GD/gradle.properties"
          printf "\nkotlin.parallel.tasks.in.project=true\nkapt.use.worker.api=true\nandroid.enableR8.fullMode=false\nandroid.defaults.buildfeatures.buildconfig=false\n" >> "$GD/gradle.properties"
          [ "$BUILD_TYPE" = "debug" ] && TASK="assembleDebug" || TASK="assembleRelease"
          echo "[ .. ] Running Gradle $TASK..."
          cd "$GD"
          ./gradlew "$TASK" --no-daemon --parallel --build-cache --configure-on-demand             --warning-mode=none -x test -x lint --console=plain 2>&1 | tail -10
          ELAPSED=$(( $(date +%s) - T0 ))
          echo "[ OK ] Build done in ${ELAPSED}s"

      - name: "[VxzWorker] Find APK"
        run: |
          set -eo pipefail
          BT="${{ github.event.inputs.build_type }}"
          if [ "$BT" = "debug" ]; then
            APK=$(find $GITHUB_WORKSPACE -name "*debug*.apk" ! -name "*unsigned*" 2>/dev/null | head -1)
            [ -z "$APK" ] && APK=$(find $GITHUB_WORKSPACE -name "*.apk" 2>/dev/null | head -1)
          else
            APK=$(find $GITHUB_WORKSPACE -name "*release*.apk" ! -name "*unsigned*" 2>/dev/null | head -1)
            [ -z "$APK" ] && APK=$(find $GITHUB_WORKSPACE -name "*release*.apk" 2>/dev/null | head -1)
          fi
          [ -z "$APK" ] && APK=$(find $GITHUB_WORKSPACE -name "*.apk" 2>/dev/null | head -1)
          [ -z "$APK" ] && { echo "[FAIL] APK not found"; exit 1; }
          ABS=$(realpath "$APK")
          SZ=$(du -sh "$ABS" | cut -f1)
          echo "[ OK ] APK found: $(basename $ABS) [$SZ]"
          echo "APK_ABS_PATH=$ABS" >> $GITHUB_ENV

      - name: "[VxzWorker] Press APK"
        if: ${{ github.event.inputs.press_apk != 'false' }}
        run: |
          set -eo pipefail
          IN="${{ env.APK_ABS_PATH }}"
          OUT="${IN%.apk}_pressed.apk"
          SIGNED=$(node -e "const fs=require('fs');try{const fd=fs.openSync(process.argv[1],'r');const sz=fs.fstatSync(fd).size;const buf=Buffer.alloc(Math.min(65558,sz));fs.readSync(fd,buf,0,buf.length,sz-buf.length);fs.closeSync(fd);let o=-1;for(let i=buf.length-22;i>=0;i--){if(buf[i]===0x50&&buf[i+1]===0x4b&&buf[i+2]===0x05&&buf[i+3]===0x06){o=i;break;}}if(o<0){process.stdout.write('false');process.exit(0);}const cd=buf.readUInt32LE(o+16);if(cd<24){process.stdout.write('false');process.exit(0);}const fd2=fs.openSync(process.argv[1],'r');const mg=Buffer.alloc(16);fs.readSync(fd2,mg,0,16,cd-16);fs.closeSync(fd2);process.stdout.write(mg.toString('utf8')==='APK Sig Block 42'?'true':'false');}catch(e){process.stdout.write('false');}" "$IN")
          if [ "$SIGNED" = "true" ]; then
            echo "[ -- ] APK already signed, skip press"
            echo "APK_ABS_PATH=$IN" >> $GITHUB_ENV
            exit 0
          fi
          echo "[ .. ] Compressing APK..."
          echo "" | base64 -d > /tmp/press_apk.js
          node /tmp/press_apk.js "$IN" "$OUT"
          if [ -f "$OUT" ] && [ -s "$OUT" ]; then
            SZ=$(du -sh "$OUT" | cut -f1)
            echo "[ OK ] Pressed: $(basename $OUT) [$SZ]"
            echo "APK_ABS_PATH=$OUT" >> $GITHUB_ENV
          else
            echo "[ -- ] Press skipped, using original"
            echo "APK_ABS_PATH=$IN" >> $GITHUB_ENV
          fi

      - name: "[VxzWorker] Upload"
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: ${{ env.APK_ABS_PATH }}
          retention-days: 1
          if-no-files-found: error
          compression-level: 0

      - name: "[VxzWorker] Done"
        if: always()
        run: |
          ELAPSED=$(( $(date +%s) - ${BUILD_START:-$(date +%s)} ))
          MIN=$(( ELAPSED / 60 ))
          SEC=$(( ELAPSED % 60 ))
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Worker  : ${WORKER_ID:-VxzWorker}"
          echo "  Status  : ${{ job.status }}"
          echo "  Elapsed : ${MIN}m ${SEC}s"
          echo "  Tag     : ${{ github.event.inputs.tag }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
