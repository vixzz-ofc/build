name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Android"
        required: true
      tag:
        description: "Tag build"
        required: true
      build_type:
        description: "debug / release"
        required: true
        default: "release"
      press_apk:
        description: "Compress APK (true/false)"
        required: false
        default: "true"
      pat_token:
        description: "Token untuk download ZIP"
        required: false
        default: ""

concurrency:
  group: android-build-${{ github.ref }}-${{ github.event.inputs.tag }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GRADLE_USER_HOME: /opt/gradle-home
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.configureondemand=true -Dorg.gradle.workers.max=4 -Dorg.gradle.jvmargs=-Xmx2500m -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m -Dkotlin.incremental=false -Dkotlin.parallel.tasks.in.project=true"
      JAVA_OPTS: "-Xmx2500m -XX:+UseParallelGC"
      # Versi fixed untuk Android Native (tidak bergantung Flutter)
      GRADLE_VER: "9.1.0"
      AGP_VER: "9.0.1"
      KOTLIN_VER: "2.2.10"

    steps:

      - name: "☕ [Setup] Setup JDK 17"
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: "💾 [Cache] Cache Gradle"
        uses: actions/cache@v4
        with:
          path: |
            /opt/gradle-home/caches
            /opt/gradle-home/wrapper
          key: gradle-android-linux-v5
          restore-keys: gradle-android-linux-v5

      - name: "📥 [Download] Download ZIP Project"
        timeout-minutes: 4
        env:
          ZIP_URL: ${{ github.event.inputs.zip_url }}
          INPUT_PAT_TOKEN: ${{ github.event.inputs.pat_token }}
          SECRET_PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -eo pipefail
          TOKEN="${SECRET_PAT_TOKEN:-}"
          download_zip() {
            if [ -n "$TOKEN" ]; then
              curl -fLsS -o /tmp/project.zip -w "%{http_code}" -H "Authorization: Bearer $TOKEN" -H "Accept: application/octet-stream" --connect-timeout 15 --max-time 120 "$ZIP_URL"
            else
              curl -fLsS -o /tmp/project.zip -w "%{http_code}" -H "Accept: application/octet-stream" --connect-timeout 15 --max-time 120 "$ZIP_URL"
            fi
          }
          for i in $(seq 1 5); do
            HTTP_CODE=$(download_zip || echo "000")
            { [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "302" ]; } && { echo "OK"; break; }
            rm -f /tmp/project.zip
            [ "$i" = "5" ] && { echo "GAGAL $HTTP_CODE"; exit 1; }
            sleep 5
          done
          file /tmp/project.zip | grep -qi "zip" || { echo "Bukan ZIP valid"; exit 1; }
          echo "ZIP OK $(du -sh /tmp/project.zip | cut -f1)"

      - name: "🔍 [Extract] Extract ZIP + Detect Project Info"
        run: |
          set -eo pipefail
          echo "════════════════════════════════════════"
          echo "  🤖 BUILD ENGINE  : Android Native"
          echo "  📦 BUILD TYPE    : ${{ github.event.inputs.build_type }}"
          echo "  🏷️  TAG           : ${{ github.event.inputs.tag }}"
          echo "════════════════════════════════════════"
          mkdir -p project_raw
          unzip -q /tmp/project.zip -d project_raw
          rm -f /tmp/project.zip
          TOP_DIRS=$(find project_raw -mindepth 1 -maxdepth 1 -type d | wc -l)
          TOP_FILES=$(find project_raw -mindepth 1 -maxdepth 1 -type f | wc -l)
          if [ "$TOP_DIRS" -eq 1 ] && [ "$TOP_FILES" -eq 0 ]; then
            PROJECT_DIR=$(find project_raw -maxdepth 1 -mindepth 1 -type d | head -1)
          else
            PROJECT_DIR="project_raw"
          fi
          echo "PROJECT_DIR=${PROJECT_DIR%/}" >> $GITHUB_ENV
          echo ""
          echo "  📁 Project Dir: ${PROJECT_DIR%/}"
          # Detect app info from build.gradle
          APP_ID=$(grep -rh "applicationId" "${PROJECT_DIR%/}/app/build.gradle" 2>/dev/null | grep -oP 'applicationId\s+["'\''"]\K[^"'\''"\ ]+' | head -1 || echo "unknown")
          echo "  📱 App ID: $APP_ID"
          GRADLE_COUNT=$(find "${PROJECT_DIR%/}" -name "build.gradle" -o -name "build.gradle.kts" 2>/dev/null | wc -l)
          echo "  🔧 Gradle files: $GRADLE_COUNT"
          echo "════════════════════════════════════════"

      # ══════════════════════════════════════════════════════════════════
      #  FIX GRADLE UNIVERSAL — scan semua android root dalam project
      # ══════════════════════════════════════════════════════════════════
      - name: "🔧 [Gradle] Fix Gradle + AGP + Kotlin Version"
        run: |
          set -eo pipefail

          # Kumpulkan semua android root yang punya gradle wrapper
          ANDROID_ROOTS=()
          for CANDIDATE in "$PROJECT_DIR" "$PROJECT_DIR/android" "$PROJECT_DIR/app"; do
            [ -f "$CANDIDATE/gradle/wrapper/gradle-wrapper.properties" ] && ANDROID_ROOTS+=("$CANDIDATE")
          done
          while IFS= read -r GW; do
            DIR=$(dirname "$GW")
            [[ " ${ANDROID_ROOTS[*]} " != *" $DIR "* ]] && ANDROID_ROOTS+=("$DIR")
          done < <(find "$PROJECT_DIR" -name "gradlew" ! -path "*/.gradle/*" ! -path "*/build/*" 2>/dev/null | head -5)

          if [ ${#ANDROID_ROOTS[@]} -eq 0 ]; then
            echo "Tidak ada android root, skip"
            exit 0
          fi

          for ADIR in "${ANDROID_ROOTS[@]}"; do
            echo "── Fix: $ADIR ──"
            chmod +x "$ADIR/gradlew" 2>/dev/null || true

            # 1. Gradle wrapper
            WRAPPER="$ADIR/gradle/wrapper/gradle-wrapper.properties"
            if [ -f "$WRAPPER" ]; then
              sed -i "s|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip|g" "$WRAPPER"
              echo "  wrapper → gradle $GRADLE_VER"
            fi

            # 2. settings.gradle / .kts
            for F in "$ADIR/settings.gradle" "$ADIR/settings.gradle.kts"; do
              [ ! -f "$F" ] && continue
              sed -i -E "s/(id[[:space:]]*\\(?[[:space:]]*\"com\\.android\\.application\"[[:space:]]*\\)?[[:space:]]*version[[:space:]]*)['\"][0-9.]+['\"]/\\1\"${AGP_VER}\"/g" "$F"
              sed -i -E "s/(id[[:space:]]*\\(?[[:space:]]*'com\\.android\\.application'[[:space:]]*\\)?[[:space:]]*version[[:space:]]*)['\"][0-9.]+['\"]/\\1\"${AGP_VER}\"/g" "$F"
              sed -i -E "s/(id[[:space:]]*\\(?[[:space:]]*\"org\\.jetbrains\\.kotlin\\.android\"[[:space:]]*\\)?[[:space:]]*version[[:space:]]*)['\"][0-9.]+['\"]/\\1\"${KOTLIN_VER}\"/g" "$F"
              sed -i -E "s/(id[[:space:]]*\\(?[[:space:]]*'org\\.jetbrains\\.kotlin\\.android'[[:space:]]*\\)?[[:space:]]*version[[:space:]]*)['\"][0-9.]+['\"]/\\1\"${KOTLIN_VER}\"/g" "$F"
              echo "  $(basename $F) fixed"
            done

            # 3. Root build.gradle classpath style
            for F in "$ADIR/build.gradle" "$ADIR/build.gradle.kts"; do
              [ ! -f "$F" ] && continue
              sed -i "s|classpath[[:space:]]*['\"]com\\.android\\.tools\\.build:gradle:[0-9.]*['\"]|classpath \"com.android.tools.build:gradle:${AGP_VER}\"|g" "$F"
              sed -i "s|classpath[[:space:]]*['\"]org\\.jetbrains\\.kotlin:kotlin-gradle-plugin:[0-9.]*['\"]|classpath \"org.jetbrains.kotlin:kotlin-gradle-plugin:${KOTLIN_VER}\"|g" "$F"
              echo "  $(basename $F) classpath fixed"
            done

            # 4. App build.gradle
            for F in "$ADIR/app/build.gradle" "$ADIR/app/build.gradle.kts"; do
              [ ! -f "$F" ] && continue
              sed -i "s|ext\\.kotlin_version[[:space:]]*=[[:space:]]*['\"][0-9.]*['\"]|ext.kotlin_version = \"${KOTLIN_VER}\"|g" "$F"
              CUR=$(grep -oP 'compileSdk(Version)?\s*=?\s*\K[0-9]+' "$F" | head -1)
              if [ -n "$CUR" ] && [ "$CUR" -lt 35 ]; then
                sed -i -E "s/compileSdk(Version)?[[:space:]]*=?[[:space:]]*[0-9]+/compileSdk 35/g" "$F"
                echo "  compileSdk $CUR→35"
              fi
              CUR=$(grep -oP 'minSdk(Version)?\s*=?\s*\K[0-9]+' "$F" | head -1)
              if [ -n "$CUR" ] && [ "$CUR" -lt 21 ]; then
                sed -i -E "s/minSdk(Version)?[[:space:]]*=?[[:space:]]*[0-9]+/minSdkVersion 21/g" "$F"
                echo "  minSdk $CUR→21"
              fi
              if ! grep -q "namespace" "$F"; then
                APP_ID=$(grep -oP 'applicationId\s+["\x27]\K[^"\x27]+' "$F" | head -1)
                [ -z "$APP_ID" ] && APP_ID=$(grep -oP 'applicationId\s*=\s*["\x27]\K[^"\x27]+' "$F" | head -1)
                if [ -n "$APP_ID" ]; then
                  sed -i "/android[[:space:]]*{/a\\    namespace \"$APP_ID\"" "$F"
                  echo "  namespace: $APP_ID"
                fi
              fi
            done

            # 5. gradle.properties
            GPROPS="$ADIR/gradle.properties"
            [ ! -f "$GPROPS" ] && touch "$GPROPS"
            grep -q "android.useAndroidX"    "$GPROPS" || echo "android.useAndroidX=true"    >> "$GPROPS"
            grep -q "android.enableJetifier" "$GPROPS" || echo "android.enableJetifier=true" >> "$GPROPS"
            grep -q "org.gradle.jvmargs"     "$GPROPS" || echo "org.gradle.jvmargs=-Xmx2048m -XX:+UseParallelGC" >> "$GPROPS"
            echo "  gradle.properties updated"
          done
          echo "Fix done"

      # ══════════════════════════════════════════════════════════════════
      #  FIX MAVEN URL SYNTAX — Python script (robust, handle multiline)
      #  ROOT CAUSE FIX: maven { url "X" } → maven("X") untuk Gradle 9.x
      # ══════════════════════════════════════════════════════════════════
      - name: "🔧 [Gradle] Fix Maven URL Syntax + Repositories (Gradle 9.x compat)"
        run: |
          set -eo pipefail
          python3 << 'PYEOF'
          import os, re, sys

          def fix_gradle_file(content):
              changed = False
              # jcenter → mavenCentral
              if 'jcenter()' in content:
                  content = content.replace('jcenter()', 'mavenCentral()')
                  changed = True
              # Single-line: maven { url "X" } or maven { url 'X' } → maven("X")
              p1 = re.compile(r'maven\s*\{\s*url\s*=?\s*(?:uri\s*\(\s*)?["\']([\'^"\']+)["\''](?:\s*\))?\s*\}', re.IGNORECASE)
              n = p1.sub(r'maven("\1")', content)
              if n != content: content, changed = n, True
              # Multi-line: maven {\n  url "X"\n}
              p2 = re.compile(r'maven\s*\{\s*\n\s*url\s*=?\s*(?:uri\s*\(\s*)?["\']([\'^"\']+)["\''](?:\s*\))?\s*\n\s*\}', re.IGNORECASE)
              n = p2.sub(r'maven("\1")', content)
              if n != content: content, changed = n, True
              # Add jitpack if missing
              if 'jitpack' not in content and 'mavenCentral()' in content:
                  content = content.replace('mavenCentral()', 'mavenCentral()\n        maven("https://jitpack.io")', 1)
                  changed = True
              # Add google() if missing
              if 'google()' not in content and 'repositories' in content and 'mavenCentral()' in content:
                  content = content.replace('mavenCentral()', 'google()\n        mavenCentral()', 1)
                  changed = True
              return content, changed

          project_dir = os.environ.get('PROJECT_DIR', 'project_raw')
          fixed = 0
          scanned = 0
          for root, dirs, files in os.walk(project_dir):
              dirs[:] = [d for d in dirs if d not in ('build', '.gradle', '.dart_tool', 'node_modules')]
              for fname in files:
                  if fname in ('build.gradle', 'build.gradle.kts', 'settings.gradle', 'settings.gradle.kts'):
                      fpath = os.path.join(root, fname)
                      scanned += 1
                      try:
                          with open(fpath, 'r', encoding='utf-8', errors='replace') as f: orig = f.read()
                          fixed_c, changed = fix_gradle_file(orig)
                          if changed:
                              with open(fpath, 'w', encoding='utf-8') as f: f.write(fixed_c)
                              fixed += 1
                              print(f"  ✅ Fixed: {os.path.relpath(fpath, project_dir)}")
                      except Exception as e:
                          print(f"  WARN: {fpath}: {e}", file=sys.stderr)
          print(f"\n✅ Maven syntax fix: scanned={scanned} fixed={fixed}")
          PYEOF

      - name: "🏗️ [Build] Build APK — Android Native (${{ github.event.inputs.build_type }})"
        timeout-minutes: 18
        run: |
          set -eo pipefail
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          START=$(date +%s)
          echo "════════════════════════════════════════"
          echo "  🏗️  MEMULAI BUILD APK"
          echo "  🤖 Engine       : Android Native (Gradle $GRADLE_VER)"
          echo "  📦 Build Type   : $BUILD_TYPE"
          echo "  🔧 AGP          : $AGP_VER"
          echo "  📐 Kotlin       : $KOTLIN_VER"
          echo "════════════════════════════════════════"
          GRADLE_PATH=""
          if [ -f "$PROJECT_DIR/gradlew" ]; then
            GRADLE_PATH="$PROJECT_DIR/gradlew"
          else
            GRADLE_PATH=$(find "$PROJECT_DIR" -name "gradlew" ! -path "*/.gradle/*" ! -path "*/build/*" -printf '%d %p\n' 2>/dev/null | sort -n | head -1 | cut -d' ' -f2-)
          fi
          [ -z "$GRADLE_PATH" ] && { echo "❌ gradlew tidak ditemukan"; exit 1; }
          GRADLE_DIR=$(dirname "$GRADLE_PATH")
          chmod +x "$GRADLE_PATH"
          echo "sdk.dir=$ANDROID_HOME" > "$GRADLE_DIR/local.properties"
          [ ! -f "$GRADLE_DIR/gradle.properties" ] && touch "$GRADLE_DIR/gradle.properties"
          printf "\nkotlin.parallel.tasks.in.project=true\nandroid.enableR8.fullMode=false\nandroid.defaults.buildfeatures.buildconfig=false\n" >> "$GRADLE_DIR/gradle.properties"
          [ "$BUILD_TYPE" = "debug" ] && TASK="assembleDebug" || TASK="assembleRelease"
          echo "▶️  Running: $GRADLE_PATH $TASK"
          cd "$GRADLE_DIR"
          ./gradlew "$TASK" --no-daemon --parallel --build-cache --configure-on-demand --warning-mode=none -x test -x lint --console=plain
          ELAPSED=$(( $(date +%s) - START ))
          echo "════════════════════════════════════════"
          echo "  ✅ BUILD OK — ${ELAPSED}s"
          echo "════════════════════════════════════════"

      - name: "📂 [Find] Locate APK"
        run: |
          set -eo pipefail
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          if [ "$BUILD_TYPE" = "debug" ]; then
            APK=$(find $GITHUB_WORKSPACE -name "*debug*.apk" ! -name "*unsigned*" 2>/dev/null | head -1)
            [ -z "$APK" ] && APK=$(find $GITHUB_WORKSPACE -name "*.apk" 2>/dev/null | head -1)
          else
            APK=$(find $GITHUB_WORKSPACE -name "*release*.apk" ! -name "*unsigned*" 2>/dev/null | head -1)
            [ -z "$APK" ] && APK=$(find $GITHUB_WORKSPACE -name "*release*.apk" 2>/dev/null | head -1)
          fi
          [ -z "$APK" ] && APK=$(find $GITHUB_WORKSPACE -name "*.apk" 2>/dev/null | head -1)
          [ -z "$APK" ] && { echo "APK tidak ditemukan"; exit 1; }
          APK_ABS=$(realpath "$APK")
          echo "APK: $(basename $APK_ABS) $(du -sh $APK_ABS | cut -f1)"
          echo "APK_ABS_PATH=$APK_ABS" >> $GITHUB_ENV

      - name: "🗜️ [Press] Compress APK"
        if: ${{ github.event.inputs.press_apk != 'false' }}
        run: |
          set -eo pipefail
          APK_PATH="${{ env.APK_ABS_PATH }}"
          PRESSED_PATH="${APK_PATH%.apk}_pressed.apk"
          IS_SIGNED=$(node -e "const fs=require('fs');try{const fd=fs.openSync(process.argv[1],'r');const sz=fs.fstatSync(fd).size;const buf=Buffer.alloc(Math.min(65558,sz));fs.readSync(fd,buf,0,buf.length,sz-buf.length);fs.closeSync(fd);let off=-1;for(let i=buf.length-22;i>=0;i--){if(buf[i]===0x50&&buf[i+1]===0x4b&&buf[i+2]===0x05&&buf[i+3]===0x06){off=i;break;}}if(off<0){process.stdout.write('false');process.exit(0);}const cd=buf.readUInt32LE(off+16);if(cd<24){process.stdout.write('false');process.exit(0);}const fd2=fs.openSync(process.argv[1],'r');const magic=Buffer.alloc(16);fs.readSync(fd2,magic,0,16,cd-16);fs.closeSync(fd2);process.stdout.write(magic.toString('utf8')==='APK Sig Block 42'?'true':'false');}catch(e){process.stdout.write('false');}" "$APK_PATH")
          if [ "$IS_SIGNED" = "true" ]; then
            echo "APK signed, skip press"
            echo "APK_ABS_PATH=$APK_PATH" >> $GITHUB_ENV
            exit 0
          fi
          echo "" | base64 -d > /tmp/press_apk.js
          node /tmp/press_apk.js "$APK_PATH" "$PRESSED_PATH"
          if [ -f "$PRESSED_PATH" ] && [ -s "$PRESSED_PATH" ]; then
            echo "APK_ABS_PATH=$PRESSED_PATH" >> $GITHUB_ENV
            echo "Pressed: $(basename $PRESSED_PATH) $(du -sh $PRESSED_PATH | cut -f1)"
          else
            echo "Press gagal pakai original"
            echo "APK_ABS_PATH=$APK_PATH" >> $GITHUB_ENV
          fi

      - name: "☁️ [Upload] Upload APK"
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: ${{ env.APK_ABS_PATH }}
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
