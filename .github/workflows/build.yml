name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter"
        required: true
      tag:
        description: "Tag build"
        required: true
      build_type:
        description: "debug / release"
        required: true
        default: "release"
      only_analyze:
        description: "Hanya jalankan analyze (true/false)"
        required: false
        default: "false"
      press_apk:
        description: "Compress APK setelah build (true/false)"
        required: false
        default: "true"
      pat_token:
        description: "Token untuk download ZIP"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=false
        -Dorg.gradle.parallel=true
        -Dorg.gradle.caching=true
        -Dorg.gradle.jvmargs=-Xmx3g
        -Dkotlin.incremental=false
        -Dkotlin.compiler.execution.strategy=in-process
      JAVA_OPTS: "-Xmx3g -XX:+UseG1GC"
      PUB_CACHE: /opt/pub-cache
      FLUTTER_ANALYTICS_DISABLED: "true"
      FLUTTER_SUPPRESS_ANALYTICS: "true"
      PUB_HOSTED_URL: "https://pub.dartlang.org"

    steps:

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.4"
          channel: "stable"
          cache: true
          cache-key: flutter-3.32.4-stable

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: /opt/pub-cache
          key: pub-${{ runner.os }}-v4-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            pub-${{ runner.os }}-v4-
            pub-${{ runner.os }}-v3-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-v3-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-v3-

      - name: Install adm-zip
        run: npm install --prefer-offline adm-zip 2>/dev/null || npm install adm-zip

      # ══════════════════════════════════════════
      # DOWNLOAD & EXTRACT
      # ══════════════════════════════════════════
      - name: Download & Extract ZIP
        run: |
          RESOLVED_TOKEN="${INPUT_PAT_TOKEN:-${SECRET_PAT_TOKEN:-}}"
          HTTP_CODE=$(curl -L -s -o project.zip -w "%{http_code}" \
            ${RESOLVED_TOKEN:+-H "Authorization: Bearer $RESOLVED_TOKEN"} \
            -H "Accept: application/octet-stream" \
            --connect-timeout 15 --max-time 120 --compressed \
            "$ZIP_URL")

          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "302" ]; then
            echo "❌ DOWNLOAD GAGAL — HTTP $HTTP_CODE"
            exit 1
          fi

          unzip -q project.zip -d project_raw
          SUB_DIR_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type d | wc -l)
          FILE_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type f | wc -l)
          if [ "$SUB_DIR_COUNT" -eq 1 ] && [ "$FILE_COUNT" -eq 0 ]; then
            PROJECT_DIR=$(find project_raw -maxdepth 1 -mindepth 1 -type d | head -n 1)
          else
            PROJECT_DIR="project_raw"
          fi
          PROJECT_DIR="${PROJECT_DIR%/}"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "✅ Extract selesai → $PROJECT_DIR"
          rm -f project.zip
        env:
          ZIP_URL: ${{ github.event.inputs.zip_url }}
          INPUT_PAT_TOKEN: ${{ github.event.inputs.pat_token }}
          SECRET_PAT_TOKEN: ${{ secrets.PAT_TOKEN }}

      # ══════════════════════════════════════════
      # SET LOCAL PROPERTIES
      # ══════════════════════════════════════════
      - name: Set local.properties
        run: |
          FLUTTER_ROOT=$(dirname $(dirname $(which flutter)))
          ANDROID_SDK=/usr/local/lib/android/sdk
          find "$PROJECT_DIR" -name "local.properties" | while read LP; do
            printf "sdk.dir=%s\nflutter.sdk=%s\n" "$ANDROID_SDK" "$FLUTTER_ROOT" > "$LP"
            echo "  ✅ $LP"
          done
          # Kalau tidak ada local.properties, buat baru
          if [ -d "$PROJECT_DIR/android" ] && [ ! -f "$PROJECT_DIR/android/local.properties" ]; then
            printf "sdk.dir=%s\nflutter.sdk=%s\n" "$ANDROID_SDK" "$FLUTTER_ROOT" > "$PROJECT_DIR/android/local.properties"
            echo "  ✅ local.properties dibuat baru"
          fi

      # ══════════════════════════════════════════
      # GET DEPENDENCIES
      # ══════════════════════════════════════════
      - name: Get Dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f "pubspec.yaml" ]; then
            echo "ℹ️  Bukan Flutter project — skip"
            exit 0
          fi
          rm -f pubspec.lock
          START=$(date +%s)
          MAX_RETRIES=3
          RETRY=0
          STATUS=1
          OUTPUT=""
          while [ $RETRY -lt $MAX_RETRIES ] && [ $STATUS -ne 0 ]; do
            [ $RETRY -gt 0 ] && echo "  ⏳ Retry ke-${RETRY}..." && sleep $((RETRY * 8))
            set +e
            OUTPUT=$(flutter pub get --no-precompile 2>&1)
            STATUS=$?
            set -e
            if [ $STATUS -eq 0 ]; then break; fi
            CLEAN=$(printf '%s' "$OUTPUT" | sed 's/\x1b\[[0-9;]*[mGKHFJABCDEFRSTfnsuhl]//g')
            CONFLICT=$(printf '%s' "$CLEAN" | grep -cE "(version solving|Because |Incompatible|No versions|No compatible)" 2>/dev/null || echo 0)
            if [ "$CONFLICT" -gt 0 ] && [ $RETRY -eq 0 ]; then
              echo "  ⚠️  Version conflict — auto-patch dependency_overrides..."
              node -e "
                const fs=require('fs');
                const fp='pubspec.yaml';
                let c;try{c=fs.readFileSync(fp,'utf8');}catch{process.exit(0);}
                if(c.includes('dependency_overrides:')){console.log('dep_overrides ada');process.exit(0);}
                const PKG={'intl':'^0.19.0','collection':'^1.18.0','meta':'^1.12.0'};
                let block='\ndependency_overrides:\n';let n=0;
                for(const[k,v] of Object.entries(PKG)){if(new RegExp('^\\\\s+'+k+'\\\\s*:','m').test(c)){block+='  '+k+': '+v+'\n';n++;}}
                if(n===0)block+='  intl: ^0.19.0\n  collection: ^1.18.0\n';
                fs.writeFileSync(fp,c.trimEnd()+block);
                console.log('dep_overrides ditambah');
              "
            fi
            RETRY=$((RETRY + 1))
          done
          echo "  Durasi: $(($(date +%s) - START))s"
          if [ $STATUS -ne 0 ]; then
            CLEAN=$(printf '%s' "$OUTPUT" | sed 's/\x1b\[[0-9;]*[mGKHFJABCDEFRSTfnsuhl]//g')
            ERR=$(printf '%s' "$CLEAN" | grep -E "^\s*(Error|Because|version solving|No compatible|Incompatible|requires)" | head -20)
            [ -n "$ERR" ] && printf '%s\n' "$ERR" | sed 's/^/  /' || printf '%s\n' "$CLEAN" | tail -20 | sed 's/^/  /'
            exit 1
          fi
          echo "  ✅ pub get sukses"

      # ══════════════════════════════════════════
      # BUILD APK
      # ══════════════════════════════════════════
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          START=$(date +%s)
          BUILD_LOG=$(mktemp)

          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk

          set +e
          flutter build apk \
            --$BUILD_TYPE \
            --no-pub \
            --suppress-analytics \
            2>&1 | tee "$BUILD_LOG"
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e

          echo "  Durasi: $(($(date +%s) - START))s"

          if [ $BUILD_EXIT -ne 0 ]; then
            echo "❌ BUILD GAGAL"
            sed -i 's/\x1b\[[0-9;]*[mGKHFJABCDEFRSTfnsuhl]//g' "$BUILD_LOG"
            DART_ERR=$(grep -E "^.*\.dart:[0-9]+:[0-9]+: [Ee]rror:" "$BUILD_LOG" | sed 's|.*/lib/|lib/|' | head -12)
            GRADLE_ERR=$(grep -E "^(FAILURE|> Task|Caused by:|What went wrong:)" "$BUILD_LOG" | head -8)
            SDK_ERR=$(grep -iE "(flutter\.sdk|sdk\.dir|Could not resolve|Could not find|not found)" "$BUILD_LOG" | grep -v "^at " | head -6)
            [ -n "$DART_ERR" ]   && echo "── Dart Error ──"   && printf '%s\n' "$DART_ERR"   | sed 's/^/  /'
            [ -n "$GRADLE_ERR" ] && echo "── Gradle Error ──" && printf '%s\n' "$GRADLE_ERR" | sed 's/^/  /'
            [ -n "$SDK_ERR" ]    && echo "── SDK Error ──"    && printf '%s\n' "$SDK_ERR"    | sed 's/^/  /'
            [ -z "$DART_ERR" ] && [ -z "$GRADLE_ERR" ] && [ -z "$SDK_ERR" ] && grep -v "^$" "$BUILD_LOG" | tail -20 | sed 's/^/  /'
            rm -f "$BUILD_LOG"
            exit 1
          fi

          APK_SIZE=$(grep -oE "[0-9.]+ MB" "$BUILD_LOG" | tail -1)
          echo "✅ BUILD BERHASIL — ${APK_SIZE:-done}"
          rm -f "$BUILD_LOG"

      # ══════════════════════════════════════════
      # FIND APK
      # ══════════════════════════════════════════
      - name: Find APK Output
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          if [ "$BUILD_TYPE" = "debug" ]; then
            APK=$(find $GITHUB_WORKSPACE -name "*debug*.apk" 2>/dev/null | grep -v "unsigned" | head -1)
          else
            APK=$(find $GITHUB_WORKSPACE -name "*release*.apk" 2>/dev/null | grep -v "unsigned" | head -1)
            [ -z "$APK" ] && APK=$(find $GITHUB_WORKSPACE -name "*release*.apk" 2>/dev/null | head -1)
          fi
          [ -z "$APK" ] && APK=$(find $GITHUB_WORKSPACE -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "❌ APK tidak ditemukan"
            exit 1
          fi
          echo "APK: $(basename $APK) — $(du -sh $APK | cut -f1)"
          echo "APK_ABS_PATH=$APK" >> $GITHUB_ENV

      # ══════════════════════════════════════════
      # PRESS APK
      # ══════════════════════════════════════════
      - name: Press APK
        if: ${{ github.event.inputs.press_apk != 'false' }}
        run: |
          APK_PATH="${{ env.APK_ABS_PATH }}"
          PRESSED_PATH="${APK_PATH%.apk}_pressed.apk"

          node -e "require('adm-zip')" 2>/dev/null || npm install --prefer-offline adm-zip 2>/dev/null || npm install adm-zip

          node - "$APK_PATH" "$PRESSED_PATH" << 'NODEEOF'
          const fs=require("fs"),zlib=require("zlib");
          const inputApk=process.argv[2],outputApk=process.argv[3];

          function hasSigning(p){
            try{
              const fd=fs.openSync(p,"r"),sz=fs.fstatSync(fd).size;
              const buf=Buffer.alloc(Math.min(65558,sz));
              fs.readSync(fd,buf,0,buf.length,sz-buf.length);
              let off=-1;
              for(let i=buf.length-22;i>=0;i--){
                if(buf[i]===0x50&&buf[i+1]===0x4b&&buf[i+2]===0x05&&buf[i+3]===0x06){off=i;break;}
              }
              if(off<0){fs.closeSync(fd);return false;}
              const cd=buf.readUInt32LE(off+16);
              if(cd<24){fs.closeSync(fd);return false;}
              const magic=Buffer.alloc(16);
              fs.readSync(fd,magic,0,16,cd-16);
              fs.closeSync(fd);
              return magic.toString("utf8")==="APK Sig Block 42";
            }catch{return false;}
          }

          const T=new Uint32Array(256);
          for(let i=0;i<256;i++){let c=i;for(let j=0;j<8;j++)c=c&1?(0xedb88320^c>>>1):c>>>1;T[i]=c;}
          function crc32(b){let c=0xffffffff;for(let i=0;i<b.length;i++)c=T[(c^b[i])&0xff]^c>>>8;return(c^0xffffffff)>>>0;}

          const STORE=[/\.png$/i,/\.jpg$/i,/\.jpeg$/i,/\.webp$/i,/\.gif$/i,/\.mp4$/i,/\.mp3$/i,/\.so$/i,/\.dex$/i];
          const JUNK=[/\.DS_Store$/i,/Thumbs\.db$/i,/^__MACOSX\//,/\.tmp$/i,/\.log$/i,/~$/];

          function buildZip(files){
            const now=new Date();
            const dt=(now.getHours()<<11|now.getMinutes()<<5|Math.floor(now.getSeconds()/2));
            const dd=((now.getFullYear()-1980)<<9|(now.getMonth()+1)<<5|now.getDate());
            const lc=[],cd=[],off=[];let pos=0;
            for(const f of files){
              const nb=Buffer.from(f.name,"utf8");off.push(pos);
              const lh=Buffer.allocUnsafe(30+nb.length);
              lh.writeUInt32LE(0x04034b50,0);lh.writeUInt16LE(20,4);
              lh.writeUInt16LE(f.m===8?2:0,6);lh.writeUInt16LE(f.m,8);
              lh.writeUInt16LE(dt,10);lh.writeUInt16LE(dd,12);
              lh.writeUInt32LE(f.crc,14);lh.writeUInt32LE(f.comp.length,18);
              lh.writeUInt32LE(f.unc,22);lh.writeUInt16LE(nb.length,26);lh.writeUInt16LE(0,28);
              nb.copy(lh,30);lc.push(lh,f.comp);pos+=30+nb.length+f.comp.length;
              const ce=Buffer.allocUnsafe(46+nb.length);
              ce.writeUInt32LE(0x02014b50,0);ce.writeUInt16LE(20,4);ce.writeUInt16LE(20,6);
              ce.writeUInt16LE(f.m===8?2:0,8);ce.writeUInt16LE(f.m,10);
              ce.writeUInt16LE(dt,12);ce.writeUInt16LE(dd,14);ce.writeUInt32LE(f.crc,16);
              ce.writeUInt32LE(f.comp.length,20);ce.writeUInt32LE(f.unc,24);
              ce.writeUInt16LE(nb.length,28);ce.writeUInt16LE(0,30);ce.writeUInt16LE(0,32);
              ce.writeUInt16LE(0,34);ce.writeUInt16LE(0,36);
              ce.writeUInt32LE(f.m===8?0x20:0,38);ce.writeUInt32LE(off[off.length-1],42);
              nb.copy(ce,46);cd.push(ce);
            }
            const cdb=Buffer.concat(cd),eocd=Buffer.allocUnsafe(22);
            eocd.writeUInt32LE(0x06054b50,0);eocd.writeUInt16LE(0,4);eocd.writeUInt16LE(0,6);
            eocd.writeUInt16LE(files.length,8);eocd.writeUInt16LE(files.length,10);
            eocd.writeUInt32LE(cdb.length,12);eocd.writeUInt32LE(pos,16);eocd.writeUInt16LE(0,20);
            return Buffer.concat([...lc,cdb,eocd]);
          }

          const before=fs.statSync(inputApk).size;
          console.log("Input: "+(before/1024/1024).toFixed(2)+" MB");

          if(hasSigning(inputApk)){
            console.log("APK sudah signed (v2/v3) — skip press, pakai original");
            fs.copyFileSync(inputApk,outputApk);
            console.log("✅ Selesai (original)");
            process.exit(0);
          }

          let entries;
          try{
            const AdmZip=require("adm-zip"),zip=new AdmZip(inputApk);
            entries=zip.getEntries()
              .filter(e=>!e.isDirectory&&!JUNK.some(p=>p.test(e.entryName)))
              .map(e=>{
                const raw=e.getData(),ck=crc32(raw);
                const store=STORE.some(p=>p.test(e.entryName));
                if(store)return{name:e.entryName,comp:raw,m:0,crc:ck,unc:raw.length};
                try{
                  const def=zlib.deflateRawSync(raw,{level:6,memLevel:9});
                  if(def.length<raw.length)return{name:e.entryName,comp:def,m:8,crc:ck,unc:raw.length};
                }catch{}
                return{name:e.entryName,comp:raw,m:0,crc:ck,unc:raw.length};
              });
          }catch(e){
            console.log("adm-zip error — pakai original: "+e.message);
            fs.copyFileSync(inputApk,outputApk);
            console.log("✅ Selesai (original)");
            process.exit(0);
          }

          fs.writeFileSync(outputApk,buildZip(entries));
          const after=fs.statSync(outputApk).size;
          const saved=Math.max(0,before-after);
          console.log("Output: "+(after/1024/1024).toFixed(2)+" MB");
          console.log("Hemat: "+(saved/1024/1024).toFixed(2)+" MB ("+(before>0?((saved/before)*100).toFixed(1):0)+"%)");
          console.log("✅ Press selesai");
          NODEEOF

          PRESSED="${{ env.APK_ABS_PATH }}"
          PRESSED="${PRESSED%.apk}_pressed.apk"
          if [ -f "$PRESSED" ]; then
            echo "APK_ABS_PATH=$PRESSED" >> $GITHUB_ENV
          else
            echo "⚠️ Pressed APK tidak ada — pakai original"
          fi

      # ══════════════════════════════════════════
      # UPLOAD APK
      # ══════════════════════════════════════════
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: ${{ env.APK_ABS_PATH }}
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
