name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter"
        required: true
      tag:
        description: "Tag build"
        required: true
      build_type:
        description: "debug / release"
        required: true
        default: "release"
      only_analyze:
        description: "Hanya jalankan analyze (true/false)"
        required: false
        default: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      PUB_CACHE: /opt/pub-cache
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.configureondemand=true -Dkotlin.incremental=false -Dorg.gradle.jvmargs=-Xmx4g"

    steps:

      # =========================
      # SETUP NODE (required)
      # =========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # =========================
      # DOWNLOAD ZIP (parallel with tool setup)
      # =========================
      - name: Download ZIP project
        run: |
          curl -L \
            -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "${{ github.event.inputs.zip_url }}" \
            -o project.zip \
            --retry 3 --retry-delay 2 \
            --connect-timeout 30 \
            -w "\n=== HTTP: %{http_code} | Size: %{size_download} bytes ===\n"
          if ! unzip -t project.zip > /dev/null 2>&1; then
            echo "❌ File bukan ZIP valid!"
            xxd project.zip | head -4
            exit 1
          fi
          echo "✅ ZIP valid: $(ls -lh project.zip | awk '{print $5}')"

      # =========================
      # SETUP JAVA
      # =========================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # =========================
      # EXTRACT ZIP (early — needed to detect Flutter version)
      # =========================
      - name: Extract ZIP
        run: |
          unzip -q project.zip -d project_raw

          SUB_DIR_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type d | wc -l)
          FILE_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type f | wc -l)

          if [ "$SUB_DIR_COUNT" -eq 1 ] && [ "$FILE_COUNT" -eq 0 ]; then
            PROJECT_DIR=$(find project_raw -maxdepth 1 -mindepth 1 -type d | head -n 1)
          else
            PROJECT_DIR="project_raw"
          fi

          echo "✅ Project root: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          rm project.zip

      # =========================
      # DETECT FLUTTER VERSION from pubspec.yaml
      # =========================
      - name: Detect Flutter SDK version
        id: detect_flutter
        run: |
          PUBSPEC="$PROJECT_DIR/pubspec.yaml"
          DETECTED_VERSION=""

          if [ -f "$PUBSPEC" ]; then
            # Coba baca dari environment.flutter constraint
            # contoh: sdk: '>=3.47.0 <4.0.0' → ambil major.minor.patch minimum
            RAW=$(grep -A5 '^environment:' "$PUBSPEC" | grep 'flutter:' | head -1 || true)
            echo "Flutter constraint line: $RAW"

            # Extract versi minimum dari constraint seperti '>=3.47.0 <4.0.0'
            MIN_VER=$(echo "$RAW" | grep -oP '>=?\K[\d]+\.[\d]+\.[\d]+' | head -1 || true)
            echo "Min Flutter version from constraint: $MIN_VER"

            if [ -n "$MIN_VER" ]; then
              MAJOR=$(echo "$MIN_VER" | cut -d. -f1)
              MINOR=$(echo "$MIN_VER" | cut -d. -f2)
              PATCH=$(echo "$MIN_VER" | cut -d. -f3)

              # Map ke versi stable Flutter yang tersedia
              # Flutter 3.32.x → untuk project lama
              # Flutter 3.47.x → untuk project yang butuh 3.47+
              # Default fallback ke versi terbaru stable jika tidak dikenali
              if [ "$MAJOR" -gt 3 ] || ([ "$MAJOR" -eq 3 ] && [ "$MINOR" -ge 45 ]); then
                DETECTED_VERSION="3.47.2"
              elif [ "$MAJOR" -eq 3 ] && [ "$MINOR" -ge 35 ]; then
                DETECTED_VERSION="3.40.0"
              elif [ "$MAJOR" -eq 3 ] && [ "$MINOR" -ge 29 ]; then
                DETECTED_VERSION="3.32.0"
              else
                DETECTED_VERSION="3.32.0"
              fi
            fi
          fi

          # Fallback default
          if [ -z "$DETECTED_VERSION" ]; then
            DETECTED_VERSION="3.32.0"
          fi

          echo "✅ Flutter version to use: $DETECTED_VERSION"
          echo "flutter_version=$DETECTED_VERSION" >> $GITHUB_OUTPUT

      # =========================
      # CACHE: Flutter binary (dynamic key)
      # =========================
      - name: Cache Flutter SDK
        id: flutter-cache
        uses: actions/cache@v4
        with:
          path: |
            /opt/flutter
            ~/.pub-cache
            /opt/pub-cache
          key: flutter-${{ steps.detect_flutter.outputs.flutter_version }}-${{ runner.os }}-v2
          restore-keys: |
            flutter-${{ steps.detect_flutter.outputs.flutter_version }}-${{ runner.os }}-
            flutter-stable-${{ runner.os }}-

      # =========================
      # SETUP FLUTTER (dynamic version)
      # =========================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "${{ steps.detect_flutter.outputs.flutter_version }}"
          channel: "stable"
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ steps.detect_flutter.outputs.flutter_version }}

      # =========================
      # PRE-WARM FLUTTER
      # =========================
      - name: Pre-warm Flutter (fast precache)
        run: |
          flutter config --no-analytics --no-cli-animations
          flutter precache --android --no-ios --no-web --no-linux --no-windows --no-macos 2>/dev/null || true
          echo "✅ Flutter $(flutter --version | head -1)"

      # =========================
      # CACHE: Pub packages
      # =========================
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            /opt/pub-cache
            ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}-v2
          restore-keys: |
            pub-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}-
            pub-${{ runner.os }}-

      # =========================
      # CACHE: Gradle
      # =========================
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/daemon
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}-v2
          restore-keys: |
            gradle-${{ runner.os }}-

      # =========================
      # CACHE: Android build
      # =========================
      - name: Cache Android build outputs
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PROJECT_DIR }}/.dart_tool
            ${{ env.PROJECT_DIR }}/build/intermediates
          key: android-build-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}-v1
          restore-keys: |
            android-build-${{ runner.os }}-

      # =========================
      # ANALYZE (only if requested)
      # =========================
      - name: Analyze Project Code
        if: ${{ github.event.inputs.only_analyze == 'true' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "pubspec.yaml" ]; then
            flutter analyze > analyze_report.txt 2>&1 || true
            echo "[RESULT_ANALYZE]"
            cat analyze_report.txt
            echo "[END_RESULT_ANALYZE]"
          else
            echo "[RESULT_ANALYZE]"
            echo "❌ pubspec.yaml tidak ditemukan."
            echo "[END_RESULT_ANALYZE]"
          fi
          exit 1

      # =========================
      # PUB GET (optimized)
      # =========================
      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "pubspec.yaml" ]; then
            # Coba pub get, jika gagal karena SDK mismatch — downgrade constraint
            flutter pub get --no-precompile 2>&1 | tee /tmp/pubget.log | tail -5
            if grep -q "Failed to update packages" /tmp/pubget.log; then
              echo "⚠️ pub get gagal — mencoba upgrade constraint..."
              # Hapus .dart_tool/package_config.json untuk force resolve ulang
              rm -rf .dart_tool pubspec.lock
              flutter pub get 2>&1 | tail -10
            fi
            echo "✅ pub get done"
          else
            echo "☕ Bukan project Flutter standar, skip pub get!"
          fi

      # =========================
      # BUILD APK (super optimized)
      # =========================
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "▶ Mode: ${{ github.event.inputs.build_type }}"
          echo "▶ Flutter: ${{ steps.detect_flutter.outputs.flutter_version }}"
          if [ -f "pubspec.yaml" ]; then
            flutter build apk \
              --${{ github.event.inputs.build_type }} \
              --no-pub \
              --suppress-analytics \
              --no-tree-shake-icons \
              2>&1 | tail -20
          else
            GRADLE_PATH=$(find . -name "gradlew" | head -n 1)
            if [ -z "$GRADLE_PATH" ]; then
              echo "❌ ERROR: gradlew tidak ditemukan!"
              exit 1
            fi
            GRADLE_DIR=$(dirname "$GRADLE_PATH")
            cd "$GRADLE_DIR"
            chmod +x gradlew
            if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
              ./gradlew assembleDebug \
                --parallel --build-cache --no-daemon \
                --configuration-cache 2>&1 | tail -20
            else
              ./gradlew assembleRelease \
                --parallel --build-cache --no-daemon \
                --configuration-cache 2>&1 | tail -20
            fi
          fi

      # =========================
      # CHECK APK
      # =========================
      - name: Check APK Output
        run: |
          APK_FOUND=$(find $GITHUB_WORKSPACE -name "*.apk" | head -n 1)
          if [ -z "$APK_FOUND" ]; then
            echo "❌ APK tidak ditemukan."
            exit 1
          fi
          APK_REL=$(echo "$APK_FOUND" | sed "s|$GITHUB_WORKSPACE/||")
          echo "✅ APK: $APK_REL ($(du -sh "$APK_FOUND" | cut -f1))"
          echo "APK_PATH=$APK_REL" >> $GITHUB_ENV
          echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      # =========================
      # UPLOAD APK
      # =========================
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: ${{ env.PROJECT_DIR }}/${{ env.APK_PATH }}
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
