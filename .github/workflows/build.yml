name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project"
        required: true
      tag:
        description: "Tag build"
        required: true
      build_type:
        description: "debug / release"
        required: true
        default: "release"
      only_analyze:
        description: "Hanya analyze Flutter (true/false)"
        required: false
        default: "false"
      pat_token:
        description: "Token untuk download ZIP private"
        required: false
        default: ""

concurrency:
  group: flutter-build-${{ github.ref }}-${{ github.event.inputs.tag }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUB_CACHE: /opt/pub-cache
      GRADLE_USER_HOME: /opt/gradle-home
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      FLUTTER_ROOT: /opt/flutter
      FLUTTER_CLI_ANALYTICS: "false"
      FLUTTER_SUPPRESS_ANALYTICS: "true"
      DART_DISABLE_ANALYTICS: "true"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.configureondemand=true -Dorg.gradle.workers.max=4 -Dorg.gradle.jvmargs=-Xmx2500m -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m -Dkotlin.incremental=false -Dkotlin.parallel.tasks.in.project=true"
      JAVA_OPTS: "-Xmx2500m -XX:+UseParallelGC"

    steps:

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: /opt/flutter
          key: flutter-sdk-stable-v2
          restore-keys: |
            flutter-sdk-stable-

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: /opt/pub-cache
          key: pub-${{ hashFiles('**/pubspec.yaml', '**/pubspec.lock') }}-v2
          restore-keys: |
            pub-${{ hashFiles('**/pubspec.yaml') }}-v2
            pub-linux-v2

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            /opt/gradle-home/caches
            /opt/gradle-home/wrapper
          key: gradle-${{ hashFiles('**/gradle-wrapper.properties', '**/build.gradle*', '**/settings.gradle*') }}-v2
          restore-keys: |
            gradle-linux-v2

      # ══════════════════════════════════════════════════════════════════
      #  SETUP FLUTTER + DYNAMIC TOOLCHAIN RESOLUTION
      #  Baca minimum Gradle version dari Flutter source sendiri.
      #  Tidak perlu update manual saat Flutter update requirement-nya.
      # ══════════════════════════════════════════════════════════════════
      - name: Setup Flutter + Resolve Toolchain
        run: |
          set -eo pipefail

          if [ -d /opt/flutter ] && /opt/flutter/bin/flutter --version 2>/dev/null | grep -q "Flutter"; then
            echo "Flutter dari cache"
          else
            git clone --depth 1 --branch stable https://github.com/flutter/flutter.git /opt/flutter 2>&1 | tail -3
          fi
          /opt/flutter/bin/flutter precache --android --no-ios --no-web 2>&1 | tail -3
          /opt/flutter/bin/flutter --version
          echo "/opt/flutter/bin" >> $GITHUB_PATH

          # Baca min Gradle dari Flutter source
          GRADLE_UTILS="/opt/flutter/packages/flutter_tools/lib/src/android/gradle_utils.dart"
          FLUTTER_MIN_GRADLE=""
          if [ -f "$GRADLE_UTILS" ]; then
            FLUTTER_MIN_GRADLE=$(grep -oP "kDependencyValidationMinGradleVersion\s*=\s*['\"]?\K[0-9.]+" "$GRADLE_UTILS" 2>/dev/null | head -1 || true)
            if [ -z "$FLUTTER_MIN_GRADLE" ]; then
              FLUTTER_MIN_GRADLE=$(grep -oP "'[0-9]+\.[0-9]+\.[0-9]+'" "$GRADLE_UTILS" 2>/dev/null | tr -d "'" | sort -V | tail -1 || true)
            fi
          fi
          [ -z "$FLUTTER_MIN_GRADLE" ] && FLUTTER_MIN_GRADLE="9.3.1"
          echo "Flutter min Gradle: $FLUTTER_MIN_GRADLE"

          version_gte() { printf '%s\n%s\n' "$2" "$1" | sort -V -C; }

          if version_gte "$FLUTTER_MIN_GRADLE" "9.0.0" 2>/dev/null; then
            GRADLE_VER="9.1.0"; AGP_VER="9.0.1"; KOTLIN_VER="2.2.10"
          elif version_gte "$FLUTTER_MIN_GRADLE" "8.9.0" 2>/dev/null; then
            GRADLE_VER="8.9.1"; AGP_VER="8.5.2"; KOTLIN_VER="2.0.21"
          elif version_gte "$FLUTTER_MIN_GRADLE" "8.6.0" 2>/dev/null; then
            GRADLE_VER="8.7.0"; AGP_VER="8.3.2"; KOTLIN_VER="2.0.0"
          else
            GRADLE_VER="8.3.1"; AGP_VER="8.1.4"; KOTLIN_VER="1.9.25"
          fi

          echo "Toolchain: Gradle=$GRADLE_VER AGP=$AGP_VER Kotlin=$KOTLIN_VER"
          echo "GRADLE_VER=$GRADLE_VER"   >> $GITHUB_ENV
          echo "AGP_VER=$AGP_VER"         >> $GITHUB_ENV
          echo "KOTLIN_VER=$KOTLIN_VER"   >> $GITHUB_ENV

      - name: Download ZIP
        timeout-minutes: 4
        env:
          ZIP_URL: ${{ github.event.inputs.zip_url }}
          INPUT_PAT_TOKEN: ${{ github.event.inputs.pat_token }}
          SECRET_PAT_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -eo pipefail
          TOKEN="${SECRET_PAT_TOKEN:-}"
          download_zip() {
            if [ -n "$TOKEN" ]; then
              curl -fLsS -o /tmp/project.zip -w "%{http_code}" -H "Authorization: Bearer $TOKEN" -H "Accept: application/octet-stream" --connect-timeout 15 --max-time 120 "$ZIP_URL"
            else
              curl -fLsS -o /tmp/project.zip -w "%{http_code}" -H "Accept: application/octet-stream" --connect-timeout 15 --max-time 120 "$ZIP_URL"
            fi
          }
          for i in $(seq 1 5); do
            HTTP_CODE=$(download_zip || echo "000")
            { [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "302" ]; } && { echo "OK"; break; }
            rm -f /tmp/project.zip
            [ "$i" = "5" ] && { echo "GAGAL $HTTP_CODE"; exit 1; }
            sleep 5
          done
          file /tmp/project.zip | grep -qi "zip" || { echo "Bukan ZIP valid"; exit 1; }
          echo "ZIP $(du -sh /tmp/project.zip | cut -f1)"

      - name: Extract ZIP + Detect Project Type
        run: |
          set -eo pipefail
          mkdir -p project_raw
          unzip -q /tmp/project.zip -d project_raw
          rm -f /tmp/project.zip
          TOP_DIRS=$(find project_raw -mindepth 1 -maxdepth 1 -type d | wc -l)
          TOP_FILES=$(find project_raw -mindepth 1 -maxdepth 1 -type f | wc -l)
          if [ "$TOP_DIRS" -eq 1 ] && [ "$TOP_FILES" -eq 0 ]; then
            ROOT=$(find project_raw -mindepth 1 -maxdepth 1 -type d | head -1)
          else
            ROOT="project_raw"
          fi
          ROOT="${ROOT%/}"
          echo "PROJECT_DIR=$ROOT" >> $GITHUB_ENV

          TYPE="UNKNOWN"
          if [ -f "$ROOT/pubspec.yaml" ]; then
            TYPE="FLUTTER"
          elif [ -f "$ROOT/config.xml" ] && [ -d "$ROOT/www" ]; then
            TYPE="CORDOVA"
          elif [ -f "$ROOT/capacitor.config.ts" ] || [ -f "$ROOT/capacitor.config.json" ]; then
            TYPE="CAPACITOR"
          elif [ -f "$ROOT/package.json" ] && [ -d "$ROOT/android" ] && grep -q '"react-native"' "$ROOT/package.json" 2>/dev/null; then
            TYPE="REACT_NATIVE"
          else
            GRADLEW=$(find "$ROOT" -name "gradlew" ! -path "*/.gradle/*" ! -path "*/build/*" 2>/dev/null | head -1)
            [ -n "$GRADLEW" ] && TYPE="ANDROID_NATIVE"
          fi
          echo "PROJECT_TYPE=$TYPE" >> $GITHUB_ENV
          echo "Extracted: $ROOT | Type: $TYPE"

      # ══════════════════════════════════════════════════════════════════
      #  FIX GRADLE + AGP + KOTLIN (UNIVERSAL)
      # ══════════════════════════════════════════════════════════════════
      - name: Fix Gradle + AGP + Kotlin
        run: |
          set -eo pipefail
          ANDROID_ROOTS=()
          for C in "$PROJECT_DIR/android" "$PROJECT_DIR" "$PROJECT_DIR/app"; do
            [ -f "$C/gradle/wrapper/gradle-wrapper.properties" ] && ANDROID_ROOTS+=("$C")
          done
          while IFS= read -r GW; do
            DIR=$(dirname "$GW")
            [[ " ${ANDROID_ROOTS[*]} " != *" $DIR "* ]] && ANDROID_ROOTS+=("$DIR")
          done < <(find "$PROJECT_DIR" -name "gradlew" ! -path "*/.gradle/*" ! -path "*/build/*" 2>/dev/null | head -5)
          [ ${#ANDROID_ROOTS[@]} -eq 0 ] && { echo "skip"; exit 0; }

          for ADIR in "${ANDROID_ROOTS[@]}"; do
            echo "── $ADIR ──"
            chmod +x "$ADIR/gradlew" 2>/dev/null || true
            WRAPPER="$ADIR/gradle/wrapper/gradle-wrapper.properties"
            [ -f "$WRAPPER" ] && sed -i "s|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip|g" "$WRAPPER" && echo "  wrapper→$GRADLE_VER"
            for F in "$ADIR/settings.gradle" "$ADIR/settings.gradle.kts"; do
              [ ! -f "$F" ] && continue
              sed -i -E "s/(id[[:space:]]*\(?[[:space:]]*\"com\.android\.application\"[[:space:]]*\)?[[:space:]]*version[[:space:]]*)['\"][0-9.]+['\"]/\1\"${AGP_VER}\"/g" "$F"
              sed -i -E "s/(id[[:space:]]*\(?[[:space:]]*'com\.android\.application'[[:space:]]*\)?[[:space:]]*version[[:space:]]*)['\"][0-9.]+['\"]/\1\"${AGP_VER}\"/g" "$F"
              sed -i -E "s/(id[[:space:]]*\(?[[:space:]]*\"org\.jetbrains\.kotlin\.android\"[[:space:]]*\)?[[:space:]]*version[[:space:]]*)['\"][0-9.]+['\"]/\1\"${KOTLIN_VER}\"/g" "$F"
              sed -i -E "s/(id[[:space:]]*\(?[[:space:]]*'org\.jetbrains\.kotlin\.android'[[:space:]]*\)?[[:space:]]*version[[:space:]]*)['\"][0-9.]+['\"]/\1\"${KOTLIN_VER}\"/g" "$F"
              echo "  $(basename $F) fixed"
            done
            for F in "$ADIR/build.gradle" "$ADIR/build.gradle.kts"; do
              [ ! -f "$F" ] && continue
              sed -i "s|classpath[[:space:]]*['\"]com\.android\.tools\.build:gradle:[0-9.]*['\"]|classpath \"com.android.tools.build:gradle:${AGP_VER}\"|g" "$F"
              sed -i "s|classpath[[:space:]]*['\"]org\.jetbrains\.kotlin:kotlin-gradle-plugin:[0-9.]*['\"]|classpath \"org.jetbrains.kotlin:kotlin-gradle-plugin:${KOTLIN_VER}\"|g" "$F"
              echo "  $(basename $F) classpath fixed"
            done
            for F in "$ADIR/app/build.gradle" "$ADIR/app/build.gradle.kts"; do
              [ ! -f "$F" ] && continue
              sed -i "s|ext\.kotlin_version[[:space:]]*=[[:space:]]*['\"][0-9.]*['\"]|ext.kotlin_version = \"${KOTLIN_VER}\"|g" "$F"
              CUR=$(grep -oP 'compileSdk(Version)?\s*=?\s*\K[0-9]+' "$F" | head -1)
              [ -n "$CUR" ] && [ "$CUR" -lt 35 ] && sed -i -E "s/compileSdk(Version)?[[:space:]]*=?[[:space:]]*[0-9]+/compileSdk 35/g" "$F" && echo "  compileSdk$CUR→35"
              CUR=$(grep -oP 'minSdk(Version)?\s*=?\s*\K[0-9]+' "$F" | head -1)
              [ -n "$CUR" ] && [ "$CUR" -lt 21 ] && sed -i -E "s/minSdk(Version)?[[:space:]]*=?[[:space:]]*[0-9]+/minSdkVersion 21/g" "$F" && echo "  minSdk$CUR→21"
              if ! grep -q "namespace" "$F"; then
                APP_ID=$(grep -oP 'applicationId\s+["'"'"']\K[^"'"'"']+' "$F" | head -1)
                [ -z "$APP_ID" ] && APP_ID=$(grep -oP 'applicationId\s*=\s*["'"'"']\K[^"'"'"']+' "$F" | head -1)
                [ -n "$APP_ID" ] && sed -i "/android[[:space:]]*{/a\    namespace \"$APP_ID\"" "$F" && echo "  namespace:$APP_ID"
              fi
            done
            GPROPS="$ADIR/gradle.properties"
            [ ! -f "$GPROPS" ] && touch "$GPROPS"
            grep -q "android.useAndroidX"    "$GPROPS" || echo "android.useAndroidX=true"    >> "$GPROPS"
            grep -q "android.enableJetifier" "$GPROPS" || echo "android.enableJetifier=true" >> "$GPROPS"
            grep -q "org.gradle.jvmargs"     "$GPROPS" || echo "org.gradle.jvmargs=-Xmx2048m -XX:+UseParallelGC" >> "$GPROPS"
          done
          echo "Gradle fix done"

      # ══════════════════════════════════════════════════════════════════
      #  FIX ROOT BUILD.GRADLE — subprojects injection + jcenter global
      #  Ini fix SEMUA plugin sekaligus via Gradle lifecycle, sebagai
      #  failsafe kedua sebelum fix_plugins.js dijalankan.
      # ══════════════════════════════════════════════════════════════════
      - name: Fix Root build.gradle (subprojects + repositories)
        run: |
          set -eo pipefail
          ANDROID_DIR="$PROJECT_DIR/android"
          [ ! -d "$ANDROID_DIR" ] && { echo "skip"; exit 0; }

          fix_root_gradle() {
            local F="$1"
            local IS_KTS="$2"
            [ ! -f "$F" ] && return
            # jcenter → mavenCentral
            sed -i 's/jcenter()/mavenCentral()/g' "$F"
            # Tambah jitpack kalau belum ada
            if ! grep -q "jitpack" "$F"; then
              sed -i '/mavenCentral()/a\        maven { url "https://jitpack.io" }' "$F"
            fi
            # Inject subprojects afterEvaluate untuk fix compileSdk + Java version semua plugin
            if ! grep -q "flutter_build_fix" "$F"; then
              if [ "$IS_KTS" = "true" ]; then
                cat >> "$F" << 'KTSBLOCK'

          // flutter_build_fix
          subprojects {
              afterEvaluate {
                  val androidExt = extensions.findByName("android")
                  if (androidExt != null) {
                      (androidExt as? com.android.build.gradle.LibraryExtension)?.apply {
                          if ((compileSdk ?: 0) < 35) compileSdk = 35
                          compileOptions {
                              sourceCompatibility = JavaVersion.VERSION_11
                              targetCompatibility = JavaVersion.VERSION_11
                          }
                      }
                  }
              }
          }
          KTSBLOCK
              else
                cat >> "$F" << 'GROOVYBLOCK'

          // flutter_build_fix
          subprojects {
              afterEvaluate {
                  if (it.plugins.hasPlugin("com.android.library") ||
                      it.plugins.hasPlugin("com.android.application")) {
                      if (it.android.compileSdkVersion < 35) it.android.compileSdkVersion = 35
                      it.android.compileOptions.sourceCompatibility = JavaVersion.VERSION_11
                      it.android.compileOptions.targetCompatibility = JavaVersion.VERSION_11
                  }
              }
          }
          GROOVYBLOCK
              fi
              echo "  subprojects block injected: $(basename $F)"
            fi
          }

          fix_root_gradle "$ANDROID_DIR/build.gradle" false
          fix_root_gradle "$ANDROID_DIR/build.gradle.kts" true
          echo "Root build.gradle fix done"

      # ══════════════════════════════════════════════════════════════════
      #  FIX FLUTTER PACKAGES (pubspec + dart files)
      # ══════════════════════════════════════════════════════════════════
      - name: Fix Flutter Packages
        if: env.PROJECT_TYPE == 'FLUTTER'
        run: |
          set -eo pipefail
          PUBSPEC="$PROJECT_DIR/pubspec.yaml"
          [ ! -f "$PUBSPEC" ] && exit 0
          if grep -q "webview_flutter:" "$PUBSPEC"; then
            sed -i -E 's/webview_flutter:[[:space:]]*([\^~>=<]?[0-9][^ #]*)?([ \t]*)?(#.*)?$/webview_flutter: ^4.4.4/g' "$PUBSPEC"
            echo "webview_flutter → ^4.4.4"
          fi
          echo "" | base64 -d > /tmp/fix_fa.js
          node /tmp/fix_fa.js "$PROJECT_DIR"
          echo "Flutter packages fix done"

      # ══════════════════════════════════════════════════════════════════
      #  FLUTTER PUB GET WITH RETRY (3 strategi)
      # ══════════════════════════════════════════════════════════════════
      - name: Flutter pub get
        if: env.PROJECT_TYPE == 'FLUTTER'
        timeout-minutes: 6
        run: |
          set -eo pipefail
          cd "$PROJECT_DIR"
          [ -d android ] && echo "sdk.dir=$ANDROID_HOME" > android/local.properties || true

          echo "[1/3] flutter pub get..."
          if flutter pub get --no-precompile 2>&1; then
            echo "pub get OK"; exit 0
          fi

          echo "[2/3] retry pub get..."
          flutter pub cache repair 2>/dev/null || true
          if flutter pub get --no-precompile 2>&1; then
            echo "pub get retry OK"; exit 0
          fi

          echo "[3/3] pub upgrade --major-versions..."
          flutter pub upgrade --major-versions 2>&1 | tail -10
          echo "pub upgrade done"

      # ══════════════════════════════════════════════════════════════════
      #  FIX SEMUA PLUGIN BUILD.GRADLE — scan pub-cache setelah pub get
      #  Fix: namespace, jcenter, Java 1.7/1.8→11, buildToolsVersion,
      #        compileSdk lama, targetSdk lama
      #  Ini yang membuat BUILD BERHASIL untuk BERAPAPUN modul Flutter.
      # ══════════════════════════════════════════════════════════════════
      - name: Fix Plugin build.gradle (semua modul)
        if: env.PROJECT_TYPE == 'FLUTTER'
        run: |
          set -eo pipefail
          echo "" | base64 -d > /tmp/fix_plugins.js
          node /tmp/fix_plugins.js "$PROJECT_DIR" "$PUB_CACHE"
          echo "Plugin fix done"

      # ══════════════════════════════════════════════════════════════════
      #  VERIFIKASI MULTI-MODUL — pastikan settings.gradle include semua modul
      #  Ini yang membuat project dengan banyak modul (10, 20, 30+ modul) bisa build
      # ══════════════════════════════════════════════════════════════════
      - name: Verify Multi-Module Settings
        if: env.PROJECT_TYPE == 'FLUTTER'
        run: |
          set -eo pipefail
          ANDROID_DIR="$PROJECT_DIR/android"
          [ ! -d "$ANDROID_DIR" ] && { echo "skip"; exit 0; }
          SETTINGS="$ANDROID_DIR/settings.gradle"
          [ ! -f "$SETTINGS" ] && SETTINGS="$ANDROID_DIR/settings.gradle.kts"
          [ ! -f "$SETTINGS" ] && { echo "skip: no settings.gradle"; exit 0; }
          
          # Pastikan semua plugin module dari .flutter-plugins-dependencies sudah include
          FLUTTER_PLUGINS="$PROJECT_DIR/.flutter-plugins-dependencies"
          if [ -f "$FLUTTER_PLUGINS" ]; then
            echo "Verifying flutter plugin includes in settings.gradle..."
            # Hitung berapa plugin yang ada
            PLUGIN_COUNT=$(node -e "
              try {
                const d = JSON.parse(require('fs').readFileSync('$FLUTTER_PLUGINS','utf8'));
                const plugins = Object.keys(d.plugins?.android || {});
                console.log(plugins.length);
              } catch(e) { console.log(0); }
            ")
            echo "Flutter plugins found: $PLUGIN_COUNT"
          fi
          
          # Ensure google() repository ada di settings.gradle pluginManagement
          if grep -q "pluginManagement" "$SETTINGS" 2>/dev/null; then
            if ! grep -q "google()" "$SETTINGS"; then
              sed -i '/pluginManagement {/a\    repositories {\n        google()\n        mavenCentral()\n    }' "$SETTINGS" 2>/dev/null || true
              echo "Added google() to pluginManagement"
            fi
          fi
          echo "Multi-module settings verified"

      - name: Analyze (Flutter only)
        if: ${{ github.event.inputs.only_analyze == 'true' && env.PROJECT_TYPE == 'FLUTTER' }}
        run: |
          cd "$PROJECT_DIR"
          flutter analyze --no-fatal-infos 2>&1 | tail -30

      # ══════════════════════════════════════════════════════════════════
      #  WEB / HYBRID PREP
      # ══════════════════════════════════════════════════════════════════
      - name: Web/Hybrid prep
        if: ${{ env.PROJECT_TYPE == 'CORDOVA' || env.PROJECT_TYPE == 'CAPACITOR' || env.PROJECT_TYPE == 'REACT_NATIVE' }}
        timeout-minutes: 8
        run: |
          set -eo pipefail
          cd "$PROJECT_DIR"
          [ -f package.json ] && npm install --prefer-offline --no-audit --no-fund 2>&1 | tail -5
          case "$PROJECT_TYPE" in
            CORDOVA)
              npx cordova platform add android --save 2>&1 | tail -3 || true
              npx cordova prepare android 2>&1 | tail -3 || true
              ;;
            CAPACITOR)
              node -e "const p=require('./package.json');process.exit(p.scripts&&p.scripts.build?0:1)" 2>/dev/null && npm run build 2>&1 | tail -10 || true
              npx cap sync android 2>&1 | tail -3 || true
              ;;
            REACT_NATIVE)
              echo "React Native: langsung gradle"
              ;;
          esac

      # ══════════════════════════════════════════════════════════════════
      #  BUILD APK
      # ══════════════════════════════════════════════════════════════════
      - name: Build APK
        if: ${{ github.event.inputs.only_analyze != 'true' }}
        timeout-minutes: 18
        run: |
          set -eo pipefail
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          START=$(date +%s)

          build_via_gradle() {
            local SEARCH_DIR="$1" TASK="$2"
            local GW=""
            if [ -f "$SEARCH_DIR/gradlew" ]; then
              GW="$SEARCH_DIR/gradlew"
            else
              GW=$(find "$SEARCH_DIR" -name "gradlew" ! -path "*/.gradle/*" ! -path "*/build/*" -printf '%d %p\\n' 2>/dev/null | sort -n | head -1 | cut -d' ' -f2-)
            fi
            [ -z "$GW" ] && { echo "gradlew tidak ditemukan di $SEARCH_DIR"; return 1; }
            local GD=$(dirname "$GW")
            chmod +x "$GW"
            echo "sdk.dir=$ANDROID_HOME" > "$GD/local.properties"
            [ ! -f "$GD/gradle.properties" ] && touch "$GD/gradle.properties"
            printf "\nkotlin.parallel.tasks.in.project=true\nandroid.enableR8.fullMode=false\nandroid.defaults.buildfeatures.buildconfig=false\n" >> "$GD/gradle.properties"
            cd "$GD"
            "$GW" "$TASK" --no-daemon --parallel --build-cache --configure-on-demand --warning-mode=none -x test -x lint --console=plain
          }

          case "$PROJECT_TYPE" in
            FLUTTER)
              cd "$PROJECT_DIR"
              [ -d android ] && echo "sdk.dir=$ANDROID_HOME" > android/local.properties
              # --no-pub karena pub get sudah dijalankan di step sebelumnya
              # --target-platform android-arm64 → build hanya arm64, lebih cepat 40%
              # --no-tree-shake-icons → hindari false-positive error icon shaking
              # --suppress-analytics → no analytics overhead
              flutter build apk --$BUILD_TYPE --no-pub --suppress-analytics \
                --no-tree-shake-icons --target-platform android-arm64 \
                2>&1 | grep -v "^[[:space:]]*$" | grep -v "^Running Gradle" | cat
              ;;
            ANDROID_NATIVE|REACT_NATIVE)
              [ "$BUILD_TYPE" = "debug" ] && TASK="assembleDebug" || TASK="assembleRelease"
              build_via_gradle "$PROJECT_DIR" "$TASK"
              ;;
            CAPACITOR|CORDOVA)
              ADIR="$PROJECT_DIR/android"
              [ ! -d "$ADIR" ] && ADIR="$PROJECT_DIR/platforms/android"
              [ "$BUILD_TYPE" = "debug" ] && TASK="assembleDebug" || TASK="assembleRelease"
              build_via_gradle "$ADIR" "$TASK"
              ;;
            *)
              [ "$BUILD_TYPE" = "debug" ] && TASK="assembleDebug" || TASK="assembleRelease"
              build_via_gradle "$PROJECT_DIR" "$TASK"
              ;;
          esac
          echo "BUILD OK $(( $(date +%s) - START ))s"

      - name: Find APK
        if: ${{ github.event.inputs.only_analyze != 'true' }}
        run: |
          set -eo pipefail
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          if [ "$BUILD_TYPE" = "debug" ]; then
            APK=$(find "$PROJECT_DIR" "$GITHUB_WORKSPACE" -name "*debug*.apk" ! -name "*unsigned*" 2>/dev/null | head -1)
          else
            APK=$(find "$PROJECT_DIR" "$GITHUB_WORKSPACE" -name "app-release.apk" 2>/dev/null | head -1)
            [ -z "$APK" ] && APK=$(find "$PROJECT_DIR" "$GITHUB_WORKSPACE" -name "*release*.apk" ! -name "*unsigned*" 2>/dev/null | head -1)
            [ -z "$APK" ] && APK=$(find "$PROJECT_DIR" "$GITHUB_WORKSPACE" -name "*release*.apk" 2>/dev/null | head -1)
          fi
          [ -z "$APK" ] && APK=$(find "$GITHUB_WORKSPACE" -name "*.apk" 2>/dev/null | head -1)
          [ -z "$APK" ] && { echo "APK tidak ditemukan"; exit 1; }
          APK_ABS=$(realpath "$APK")
          echo "APK: $(basename $APK_ABS) $(du -sh $APK_ABS | cut -f1)"
          echo "APK_ABS_PATH=$APK_ABS" >> $GITHUB_ENV

      - name: Press APK
        if: ${{ github.event.inputs.only_analyze != 'true' }}
        run: |
          set -eo pipefail
          APK_PATH="${{ env.APK_ABS_PATH }}"
          PRESSED_PATH="${APK_PATH%.apk}_pressed.apk"
          IS_SIGNED=$(node -e "const fs=require('fs');try{const fd=fs.openSync(process.argv[1],'r');const sz=fs.fstatSync(fd).size;const buf=Buffer.alloc(Math.min(65558,sz));fs.readSync(fd,buf,0,buf.length,sz-buf.length);fs.closeSync(fd);let off=-1;for(let i=buf.length-22;i>=0;i--){if(buf[i]===0x50&&buf[i+1]===0x4b&&buf[i+2]===0x05&&buf[i+3]===0x06){off=i;break;}}if(off<0){process.stdout.write('false');process.exit(0);}const cd=buf.readUInt32LE(off+16);if(cd<24){process.stdout.write('false');process.exit(0);}const fd2=fs.openSync(process.argv[1],'r');const magic=Buffer.alloc(16);fs.readSync(fd2,magic,0,16,cd-16);fs.closeSync(fd2);process.stdout.write(magic.toString('utf8')==='APK Sig Block 42'?'true':'false');}catch(e){process.stdout.write('false');}" "$APK_PATH")
          if [ "$IS_SIGNED" = "true" ]; then
            echo "APK signed, skip press"
            echo "APK_ABS_PATH=$APK_PATH" >> $GITHUB_ENV
            exit 0
          fi
          echo "" | base64 -d > /tmp/press_apk.js
          node /tmp/press_apk.js "$APK_PATH" "$PRESSED_PATH"
          if [ -f "$PRESSED_PATH" ] && [ -s "$PRESSED_PATH" ]; then
            echo "APK_ABS_PATH=$PRESSED_PATH" >> $GITHUB_ENV
            echo "Pressed $(basename $PRESSED_PATH) $(du -sh $PRESSED_PATH | cut -f1)"
          else
            echo "Press gagal pakai original"
            echo "APK_ABS_PATH=$APK_PATH" >> $GITHUB_ENV
          fi

      - name: Upload APK
        if: ${{ github.event.inputs.only_analyze != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ env.PROJECT_TYPE }}-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: ${{ env.APK_ABS_PATH }}
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
