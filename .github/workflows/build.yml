name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter"
        required: true
      tag:
        description: "Tag build"
        required: true
      build_type:
        description: "debug / release"
        required: true
        default: "release"
      only_analyze:
        description: "Hanya jalankan analyze (true/false)"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: flutter-build-${{ github.ref }}-${{ github.event.inputs.tag }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PUB_CACHE: ~/.pub-cache
      GRADLE_USER_HOME: ~/.gradle
      GRADLE_OPTS: "-Dorg.gradle.daemon=true -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.workers.max=4 -Dorg.gradle.jvmargs=-Xmx4g"

    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Flutter packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: flutter-pub-v5-${{ runner.os }}-${{ hashFiles('**/pubspec.lock', '**/pubspec.yaml') }}
          restore-keys: |
            flutter-pub-v5-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: flutter-gradle-v5-${{ runner.os }}-${{ hashFiles('**/gradle-wrapper.properties', '**/*.gradle', '**/*.gradle.kts') }}
          restore-keys: |
            flutter-gradle-v5-${{ runner.os }}-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.4"
          channel: stable
          cache: true
          cache-key: flutter-3.32.4-${{ runner.os }}

      - name: Download and extract project
        timeout-minutes: 2
        env:
          ZIP_URL: ${{ github.event.inputs.zip_url }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          AUTH=()
          if [ -n "${GH_TOKEN:-}" ]; then AUTH=(-H "Authorization: Bearer $GH_TOKEN"); fi
          curl -fLsS --retry 2 --retry-delay 1 --connect-timeout 10 --max-time 90 \
            "${AUTH[@]}" -H "Accept: application/octet-stream" "$ZIP_URL" -o project.zip
          unzip -tq project.zip
          mkdir project_raw
          unzip -q project.zip -d project_raw
          ROOT=project_raw
          mapfile -t TOP_DIRS < <(find project_raw -mindepth 1 -maxdepth 1 -type d)
          TOP_FILES=$(find project_raw -mindepth 1 -maxdepth 1 -type f | wc -l)
          if [ "${#TOP_DIRS[@]}" -eq 1 ] && [ "$TOP_FILES" -eq 0 ]; then ROOT="${TOP_DIRS[0]}"; fi
          [ -f "$ROOT/pubspec.yaml" ] || { echo "pubspec.yaml tidak ditemukan"; exit 1; }
          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"

      - name: Resolve dependencies
        timeout-minutes: 2
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get --no-precompile

      - name: Analyze project
        if: ${{ github.event.inputs.only_analyze == 'true' }}
        timeout-minutes: 2
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze --no-pub

      - name: Build APK
        if: ${{ github.event.inputs.only_analyze != 'true' }}
        timeout-minutes: 4
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type }}
        run: |
          set -euo pipefail
          if [ "$BUILD_TYPE" = "debug" ]; then
            timeout 225s flutter build apk --debug --no-pub --suppress-analytics
          else
            timeout 225s flutter build apk --release --no-pub --suppress-analytics
          fi

      - name: Validate APK
        if: ${{ github.event.inputs.only_analyze != 'true' }}
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            APK=$(find "$PROJECT_DIR" -type f -name '*debug*.apk' -print -quit)
          else
            APK=$(find "$PROJECT_DIR" -type f -name '*release*.apk' -print -quit)
          fi
          [ -n "$APK" ] || { echo "APK tidak ditemukan"; exit 1; }
          [ -s "$APK" ] || { echo "APK kosong"; exit 1; }
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        if: ${{ github.event.inputs.only_analyze != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: ${{ env.APK_PATH }}
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
