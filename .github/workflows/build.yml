name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter"
        required: true
      tag:
        description: "Tag build"
        required: true
      build_type:
        description: "debug / release"
        required: true
        default: "release"
      only_analyze:
        description: "Hanya jalankan analyze (true/false)"
        required: false
        default: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 7

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      PUB_CACHE: /opt/pub-cache
      GRADLE_USER_HOME: /opt/gradle-home
      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=false
        -Dorg.gradle.parallel=true
        -Dorg.gradle.caching=true
        -Dorg.gradle.configureondemand=true
        -Dorg.gradle.workers.max=4
        -Dorg.gradle.jvmargs=-Xmx4g -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+HeapDumpOnOutOfMemoryError
        -Dkotlin.incremental=false
        -Dkotlin.compiler.execution.strategy=in-process
        -Dkotlin.daemon.jvm.options=-Xmx2g
        -XX:MaxMetaspaceSize=512m
      JAVA_OPTS: "-Xmx4g -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
      FLUTTER_CLI_ANALYTICS: "false"
      FLUTTER_SUPPRESS_ANALYTICS: "true"
      DART_DISABLE_ANALYTICS: "true"
      ANDROID_BUILD_CACHE_DIR: /opt/android-build-cache

    steps:

      # ── NODE + NPM CACHE ──────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm (adm-zip)
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-admzip-v1-${{ runner.os }}

      - name: Install adm-zip
        run: npm install --prefer-offline adm-zip 2>/dev/null || npm install adm-zip

      # ── JAVA ──────────────────────────────────────────────────────────────────
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # ── PUB CACHE ─────────────────────────────────────────────────────────────
      # Key statis per OS — selalu HIT setelah build pertama
      # pubspec.lock belum ada saat step ini, jadi hashFiles tidak berguna
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: /opt/pub-cache
          key: pub-v4-${{ runner.os }}
          restore-keys: |
            pub-v4-${{ runner.os }}
            pub-v3-${{ runner.os }}

      # ── GRADLE CACHE ──────────────────────────────────────────────────────────
      # Key statis — file gradle belum ada saat cache restore (ZIP belum didownload)
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            /opt/gradle-home/caches
            /opt/gradle-home/wrapper
            /opt/android-build-cache
          key: gradle-v5-${{ runner.os }}
          restore-keys: |
            gradle-v5-${{ runner.os }}
            gradle-v4-${{ runner.os }}
            gradle-v3-${{ runner.os }}

      # ── ANDROID SDK CACHE ─────────────────────────────────────────────────────
      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/.android/build-cache
            /home/runner/.android/cache
          key: android-sdk-v3-${{ runner.os }}
          restore-keys: |
            android-sdk-v3-${{ runner.os }}
            android-sdk-v2-${{ runner.os }}

      # ── FLUTTER CACHE — latest stable ─────────────────────────────────────────
      # Dua cache terpisah: latest + 3.29.3
      # Key statis → selalu HIT setelah warm-up pertama
      - name: Cache Flutter latest
        id: cache-flutter-latest
        uses: actions/cache@v4
        with:
          path: /opt/hostedtoolcache/flutter
          key: flutter-v5-latest-${{ runner.os }}
          restore-keys: |
            flutter-v5-latest-${{ runner.os }}
            flutter-v4-${{ runner.os }}-latest

      - name: Cache Flutter 3.29.3
        id: cache-flutter-3293
        uses: actions/cache@v4
        with:
          path: /opt/hostedtoolcache/flutter-3293
          key: flutter-v5-3.29.3-${{ runner.os }}
          restore-keys: |
            flutter-v5-3.29.3-${{ runner.os }}
            flutter-v4-${{ runner.os }}-3.29.3

      # ── DOWNLOAD ZIP ─────────────────────────────────────────────────────────
      - name: Download ZIP project
        run: |
          ZIP_URL="${{ github.event.inputs.zip_url }}"

          if echo "$ZIP_URL" | grep -q "api.github.com"; then
            curl -fsSL \
              -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
              -H "Accept: application/octet-stream" \
              -L "$ZIP_URL" -o project.zip \
              --retry 2 --retry-delay 1 \
              --connect-timeout 15 --max-time 90
          elif echo "$ZIP_URL" | grep -q "github.com.*releases/download"; then
            curl -fsSL \
              -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
              -H "Accept: application/octet-stream" \
              -L "$ZIP_URL" -o project.zip \
              --retry 2 --retry-delay 1 \
              --connect-timeout 15 --max-time 90
          else
            curl -fsSL -L "$ZIP_URL" -o project.zip \
              --retry 2 --retry-delay 1 \
              --connect-timeout 15 --max-time 90
          fi

          if [ ! -f project.zip ] || [ ! -s project.zip ]; then
            echo "❌ File ZIP tidak ada atau kosong!"
            exit 1
          fi

          if ! file project.zip | grep -qi "zip"; then
            echo "❌ File bukan ZIP valid!"
            file project.zip
            if file project.zip | grep -qi "html\|text"; then
              echo "Content: $(head -c 300 project.zip)"
            fi
            exit 1
          fi

          echo "✅ ZIP valid ($(du -sh project.zip | cut -f1))"

      # ── EXTRACT ZIP ──────────────────────────────────────────────────────────
      - name: Extract ZIP
        run: |
          unzip -q project.zip -d project_raw

          SUB=$(find project_raw -maxdepth 1 -mindepth 1 -type d | wc -l)
          FIL=$(find project_raw -maxdepth 1 -mindepth 1 -type f | wc -l)

          if [ "$SUB" -eq 1 ] && [ "$FIL" -eq 0 ]; then
            PROJECT_DIR=$(find project_raw -maxdepth 1 -mindepth 1 -type d | head -n 1)
          else
            PROJECT_DIR="project_raw"
          fi

          echo "PROJECT_DIR=${PROJECT_DIR%/}" >> $GITHUB_ENV
          rm -f project.zip

      # ── DETECT FLUTTER VERSION ────────────────────────────────────────────────
      - name: Detect Flutter version
        run: |
          PUBSPEC=$(find "$PROJECT_DIR" -name "pubspec.yaml" -maxdepth 3 | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "FLUTTER_VERSION=" >> $GITHUB_ENV
            echo "FLUTTER_CACHE_PATH=/opt/hostedtoolcache/flutter" >> $GITHUB_ENV
            exit 0
          fi

          SDK=$(grep -E "^\s+sdk:" "$PUBSPEC" | head -1 | sed "s/.*sdk:[[:space:]]*//" | tr -d "'\"\\n")
          MIN=$(echo "$SDK" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)

          FLUTTER_VER=""
          CACHE_PATH="/opt/hostedtoolcache/flutter"

          if [ -n "$MIN" ]; then
            MAJ=$(echo "$MIN" | cut -d. -f1)
            MIN2=$(echo "$MIN" | cut -d. -f2)
            if [ "$MAJ" -eq 3 ] && [ "$MIN2" -le 7 ]; then
              FLUTTER_VER="3.29.3"
              CACHE_PATH="/opt/hostedtoolcache/flutter-3293"
            fi
          fi

          echo "FLUTTER_VERSION=$FLUTTER_VER" >> $GITHUB_ENV
          echo "FLUTTER_CACHE_PATH=$CACHE_PATH" >> $GITHUB_ENV
          [ -z "$FLUTTER_VER" ] && echo "Flutter: latest" || echo "Flutter: $FLUTTER_VER"

      # ── SETUP FLUTTER ─────────────────────────────────────────────────────────
      - name: Setup Flutter
        id: flutter-setup
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true
          cache-key: flutter-v5-${{ env.FLUTTER_VERSION || 'latest' }}-${{ runner.os }}

      # ── FLUTTER PRECACHE — skip kalau cache HIT ───────────────────────────────
      - name: Flutter precache
        if: steps.flutter-setup.outputs.cache-hit != 'true'
        run: flutter precache --android --no-ios --no-web --no-linux --no-windows --no-macos

      # ── ANALYZE ONLY ──────────────────────────────────────────────────────────
      - name: Analyze Project Code
        if: ${{ github.event.inputs.only_analyze == 'true' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "pubspec.yaml" ]; then
            flutter pub get --no-precompile 2>&1 | tail -5 || true
            flutter analyze 2>&1 | tail -50 || true
          else
            echo "❌ pubspec.yaml tidak ditemukan."
          fi

      - name: Stop if Analyze Only
        if: ${{ github.event.inputs.only_analyze == 'true' }}
        run: exit 0

      # ── PUB GET ───────────────────────────────────────────────────────────────
      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f "pubspec.yaml" ]; then
            exit 0
          fi

          # pubspec.lock ada + cache terisi → offline, instant
          if [ -f "pubspec.lock" ] && [ -d "$PUB_CACHE" ] && [ "$(ls -A $PUB_CACHE 2>/dev/null)" ]; then
            if flutter pub get --no-precompile --offline 2>&1 | tail -3; then
              exit 0
            fi
          fi

          # Fallback: online
          flutter pub get --no-precompile 2>&1 | tail -8

      # ── BUILD APK ─────────────────────────────────────────────────────────────
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          START=$(date +%s)

          if [ -f "pubspec.yaml" ]; then
            flutter build apk --$BUILD_TYPE \
              --no-pub \
              --suppress-analytics \
              --no-tree-shake-icons \
              --split-debug-info=/tmp/dbg \
              2>&1 | grep -Ev "^Note:|^Downloading|^Running Gradle|^Resolving|^✓ Built|^\s*$"
            BUILD_EXIT=${PIPESTATUS[0]}
          else
            GRADLE_PATH=$(find . -name "gradlew" ! -path "*/.gradle/*" ! -path "*/build/*" | head -1)
            if [ -z "$GRADLE_PATH" ]; then
              echo "❌ gradlew tidak ditemukan!"
              exit 1
            fi
            GRADLE_DIR=$(dirname "$GRADLE_PATH")
            cd "$GRADLE_DIR"
            chmod +x gradlew
            echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
            [ "$BUILD_TYPE" = "debug" ] && TASK="assembleDebug" || TASK="assembleRelease"
            ./gradlew "$TASK" \
              --no-daemon --parallel --build-cache \
              --configure-on-demand --warning-mode=none \
              -x test -x lint \
              2>&1 | grep -Ev "^Note:|^Download|^Resolving|^\s*$"
            BUILD_EXIT=${PIPESTATUS[0]}
          fi

          DURATION=$(( $(date +%s) - START ))

          if [ $BUILD_EXIT -ne 0 ]; then
            echo "❌ BUILD GAGAL (${DURATION}s)"
            exit $BUILD_EXIT
          fi

          if [ "$BUILD_TYPE" = "debug" ]; then
            APK=$(find . -name "*debug*.apk" ! -name "*unsigned*" 2>/dev/null | head -1)
            [ -z "$APK" ] && APK=$(find . -name "*debug*.apk" 2>/dev/null | head -1)
          else
            APK=$(find . -name "*release*.apk" ! -name "*unsigned*" 2>/dev/null | head -1)
            [ -z "$APK" ] && APK=$(find . -name "*release*.apk" 2>/dev/null | head -1)
          fi
          [ -z "$APK" ] && APK=$(find . -name "*.apk" 2>/dev/null | head -1)

          if [ -z "$APK" ]; then
            echo "❌ APK tidak ditemukan setelah build"
            exit 1
          fi

          APK_ABS=$(realpath "$APK")
          echo "✅ BUILD OK — ${DURATION}s — $(basename $APK_ABS) ($(du -sh $APK_ABS | cut -f1))"
          echo "APK_ABS_PATH=$APK_ABS" >> $GITHUB_ENV

      # ── PRESS APK ─────────────────────────────────────────────────────────────
      - name: Press APK
        run: |
          APK_PATH="${{ env.APK_ABS_PATH }}"
          PRESSED_PATH="${APK_PATH%.apk}_pressed.apk"

          node - "$APK_PATH" "$PRESSED_PATH" << 'NODEEOF'
          const fs   = require("fs");
          const zlib = require("zlib");
          const inputApk  = process.argv[2];
          const outputApk = process.argv[3];

          const T = new Uint32Array(256);
          for (let i = 0; i < 256; i++) {
            let c = i;
            for (let j = 0; j < 8; j++) c = c & 1 ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
            T[i] = c;
          }
          function crc32(b) {
            let c = 0xffffffff;
            for (let i = 0; i < b.length; i++) c = T[(c ^ b[i]) & 0xff] ^ (c >>> 8);
            return (c ^ 0xffffffff) >>> 0;
          }

          function hasSigning(p) {
            try {
              const fd = fs.openSync(p, "r");
              const sz = fs.fstatSync(fd).size;
              const buf = Buffer.alloc(Math.min(65558, sz));
              fs.readSync(fd, buf, 0, buf.length, sz - buf.length);
              let off = -1;
              for (let i = buf.length - 22; i >= 0; i--) {
                if (buf[i]===0x50&&buf[i+1]===0x4b&&buf[i+2]===0x05&&buf[i+3]===0x06) { off=i; break; }
              }
              if (off < 0) { fs.closeSync(fd); return false; }
              const cd = buf.readUInt32LE(off + 16);
              if (cd < 24) { fs.closeSync(fd); return false; }
              const magic = Buffer.alloc(16);
              fs.readSync(fd, magic, 0, 16, cd - 16);
              fs.closeSync(fd);
              return magic.toString("utf8") === "APK Sig Block 42";
            } catch (e) { return false; }
          }

          const STORE = [/\.png$/i,/\.jpg$/i,/\.jpeg$/i,/\.webp$/i,/\.gif$/i,/\.mp4$/i,/\.mp3$/i,/\.ogg$/i,/\.wav$/i,/\.so$/i,/\.dex$/i,/\.arsc$/i,/\.zip$/i,/\.jar$/i,/\.class$/i];
          const JUNK  = [/\.DS_Store$/i,/Thumbs\.db$/i,/^__MACOSX\//,/\.tmp$/i,/\.log$/i,/~$/,/\.bak$/i];

          function buildZip(files) {
            const now=new Date(), dt=(now.getHours()<<11|now.getMinutes()<<5|Math.floor(now.getSeconds()/2)), dd=((now.getFullYear()-1980)<<9|(now.getMonth()+1)<<5|now.getDate());
            const lp=[],cp=[],off=[];let pos=0;
            for(const f of files){
              const nb=Buffer.from(f.name,"utf8");off.push(pos);
              const lh=Buffer.allocUnsafe(30+nb.length);
              lh.writeUInt32LE(0x04034b50,0);lh.writeUInt16LE(20,4);lh.writeUInt16LE(f.method===8?2:0,6);lh.writeUInt16LE(f.method,8);
              lh.writeUInt16LE(dt,10);lh.writeUInt16LE(dd,12);lh.writeUInt32LE(f.crc,14);lh.writeUInt32LE(f.comp.length,18);
              lh.writeUInt32LE(f.unc,22);lh.writeUInt16LE(nb.length,26);lh.writeUInt16LE(0,28);nb.copy(lh,30);
              lp.push(lh,f.comp);pos+=30+nb.length+f.comp.length;
              const ce=Buffer.allocUnsafe(46+nb.length);
              ce.writeUInt32LE(0x02014b50,0);ce.writeUInt16LE(20,4);ce.writeUInt16LE(20,6);ce.writeUInt16LE(f.method===8?2:0,8);ce.writeUInt16LE(f.method,10);
              ce.writeUInt16LE(dt,12);ce.writeUInt16LE(dd,14);ce.writeUInt32LE(f.crc,16);ce.writeUInt32LE(f.comp.length,20);
              ce.writeUInt32LE(f.unc,24);ce.writeUInt16LE(nb.length,28);ce.writeUInt16LE(0,30);ce.writeUInt16LE(0,32);ce.writeUInt16LE(0,34);
              ce.writeUInt16LE(0,36);ce.writeUInt32LE(f.method===8?0x20:0,38);ce.writeUInt32LE(off[off.length-1],42);nb.copy(ce,46);cp.push(ce);
            }
            const cdb=Buffer.concat(cp),eocd=Buffer.allocUnsafe(22);
            eocd.writeUInt32LE(0x06054b50,0);eocd.writeUInt16LE(0,4);eocd.writeUInt16LE(0,6);
            eocd.writeUInt16LE(files.length,8);eocd.writeUInt16LE(files.length,10);
            eocd.writeUInt32LE(cdb.length,12);eocd.writeUInt32LE(pos,16);eocd.writeUInt16LE(0,20);
            return Buffer.concat([...lp,cdb,eocd]);
          }

          const before=fs.statSync(inputApk).size;
          console.log("Input : "+(before/1024/1024).toFixed(2)+" MB");

          if(hasSigning(inputApk)){
            console.log("APK signed — copy original");
            fs.copyFileSync(inputApk,outputApk);
            console.log("Output: "+(fs.statSync(outputApk).size/1024/1024).toFixed(2)+" MB");
            console.log("✅ Press selesai (signed)");
            process.exit(0);
          }

          let entries;
          try {
            const AdmZip=require("adm-zip");
            entries=new AdmZip(inputApk).getEntries()
              .filter(e=>!e.isDirectory&&!JUNK.some(p=>p.test(e.entryName)))
              .map(e=>{
                const raw=e.getData(),ck=crc32(raw);
                if(STORE.some(p=>p.test(e.entryName))) return{name:e.entryName,comp:raw,method:0,crc:ck,unc:raw.length};
                try{const d=zlib.deflateRawSync(raw,{level:6,memLevel:9});if(d.length<raw.length)return{name:e.entryName,comp:d,method:8,crc:ck,unc:raw.length};}catch(_){}
                return{name:e.entryName,comp:raw,method:0,crc:ck,unc:raw.length};
              });
          } catch(e){
            console.log("adm-zip error — copy original: "+e.message);
            fs.copyFileSync(inputApk,outputApk);
            process.exit(0);
          }

          fs.writeFileSync(outputApk,buildZip(entries));
          const after=fs.statSync(outputApk).size,saved=Math.max(0,before-after);
          console.log("Output: "+(after/1024/1024).toFixed(2)+" MB");
          console.log("Hemat : "+(saved/1024/1024).toFixed(2)+" MB ("+(before>0?((saved/before)*100).toFixed(1):0)+"%)");
          console.log("✅ Press selesai");
          NODEEOF

          if [ -f "$PRESSED_PATH" ] && [ -s "$PRESSED_PATH" ]; then
            echo "APK_ABS_PATH=$PRESSED_PATH" >> $GITHUB_ENV
            echo "✅ $(basename $PRESSED_PATH) ($(du -sh $PRESSED_PATH | cut -f1))"
          else
            echo "⚠️ Press gagal, pakai original: $(basename $APK_PATH)"
          fi

      # ── UPLOAD APK ────────────────────────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: ${{ env.APK_ABS_PATH }}
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
