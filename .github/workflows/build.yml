name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter"
        required: true
      tag:
        description: "Tag build"
        required: true
      build_type:
        description: "debug / release"
        required: true
        default: "release"
      only_analyze:
        description: "Hanya jalankan analyze (true/false)"
        required: false
        default: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      PUB_CACHE: /opt/pub-cache
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.configureondemand=true -Dkotlin.incremental=false -Dorg.gradle.jvmargs=-Xmx4g"
      # Default Flutter version — akan di-override jika project butuh versi lain
      FLUTTER_VERSION: "3.32.0"

    steps:

      # =========================
      # SETUP NODE (required)
      # =========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # =========================
      # DOWNLOAD ZIP
      # =========================
      - name: Download ZIP project
        run: |
          curl -L \
            -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "${{ github.event.inputs.zip_url }}" \
            -o project.zip \
            --retry 3 --retry-delay 2 \
            --connect-timeout 30 \
            -w "\n=== HTTP: %{http_code} | Size: %{size_download} bytes ===\n"
          if ! unzip -t project.zip > /dev/null 2>&1; then
            echo "❌ File bukan ZIP valid!"
            xxd project.zip | head -4
            exit 1
          fi
          echo "✅ ZIP valid: $(ls -lh project.zip | awk '{print $5}')"

      # =========================
      # SETUP JAVA
      # =========================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # =========================
      # EXTRACT ZIP (early — needed to detect Flutter version)
      # =========================
      - name: Extract ZIP
        run: |
          unzip -q project.zip -d project_raw
          rm project.zip

          SUB_DIR_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type d | wc -l)
          FILE_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type f | wc -l)

          if [ "$SUB_DIR_COUNT" -eq 1 ] && [ "$FILE_COUNT" -eq 0 ]; then
            PROJECT_DIR=$(find project_raw -maxdepth 1 -mindepth 1 -type d | head -n 1)
          else
            PROJECT_DIR="project_raw"
          fi

          echo "✅ Project root: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      # =========================
      # DETECT FLUTTER VERSION from pubspec.yaml
      # Parse semua kemungkinan format constraint
      # =========================
      - name: Detect Flutter SDK version
        id: detect_flutter
        run: |
          PUBSPEC="$PROJECT_DIR/pubspec.yaml"
          FLUTTER_VERSION="3.32.0"

          if [ ! -f "$PUBSPEC" ]; then
            echo "⚠️ pubspec.yaml tidak ditemukan, pakai default $FLUTTER_VERSION"
            echo "flutter_version=$FLUTTER_VERSION" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "=== pubspec environment section ==="
          grep -A 10 '^environment:' "$PUBSPEC" || echo "(environment block tidak ada)"
          echo "==================================="

          # Ekstrak baris flutter di dalam environment block
          # Handle berbagai format:
          # flutter: ">=3.47.0 <4.0.0"
          # flutter: '>=3.47.0'
          # flutter: ^3.47.0
          # flutter: ">=3.47.0"
          # flutter: ">= 3.47.0"
          FLUTTER_LINE=$(awk '/^environment:/{f=1} f && /flutter:/{print; exit} f && /^[^ ]/{f=0}' "$PUBSPEC" || true)
          echo "Flutter line: '$FLUTTER_LINE'"

          if [ -z "$FLUTTER_LINE" ]; then
            # Fallback: cari baris flutter: di mana saja
            FLUTTER_LINE=$(grep -m1 'flutter:' "$PUBSPEC" || true)
            echo "Fallback flutter line: '$FLUTTER_LINE'"
          fi

          # Extract semua version number dari baris itu
          # Ambil yang pertama (minimum version)
          MIN_VER=$(echo "$FLUTTER_LINE" | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1 || true)
          echo "Min version extracted: '$MIN_VER'"

          if [ -n "$MIN_VER" ]; then
            MAJOR=$(echo "$MIN_VER" | cut -d. -f1)
            MINOR=$(echo "$MIN_VER" | cut -d. -f2)
            echo "→ Major=$MAJOR Minor=$MINOR"

            # Map ke Flutter stable version yang tersedia di subosito/flutter-action
            if   [ "$MAJOR" -gt 3 ]; then                              FLUTTER_VERSION="3.47.2"
            elif [ "$MAJOR" -eq 3 ] && [ "$MINOR" -ge 47 ]; then      FLUTTER_VERSION="3.47.2"
            elif [ "$MAJOR" -eq 3 ] && [ "$MINOR" -ge 40 ]; then      FLUTTER_VERSION="3.40.0"
            elif [ "$MAJOR" -eq 3 ] && [ "$MINOR" -ge 35 ]; then      FLUTTER_VERSION="3.40.0"
            elif [ "$MAJOR" -eq 3 ] && [ "$MINOR" -ge 29 ]; then      FLUTTER_VERSION="3.32.0"
            elif [ "$MAJOR" -eq 3 ] && [ "$MINOR" -ge 24 ]; then      FLUTTER_VERSION="3.27.0"
            elif [ "$MAJOR" -eq 3 ] && [ "$MINOR" -ge 19 ]; then      FLUTTER_VERSION="3.22.0"
            else                                                        FLUTTER_VERSION="3.32.0"
            fi
          else
            echo "⚠️ Tidak bisa parse versi flutter, pakai default"
          fi

          echo "✅ Flutter version selected: $FLUTTER_VERSION"
          echo "flutter_version=$FLUTTER_VERSION" >> $GITHUB_OUTPUT

      # =========================
      # CACHE: Flutter binary (dynamic key per version)
      # =========================
      - name: Cache Flutter SDK
        id: flutter-cache
        uses: actions/cache@v4
        with:
          path: |
            /opt/flutter
            ~/.pub-cache
            /opt/pub-cache
          key: flutter-${{ steps.detect_flutter.outputs.flutter_version }}-${{ runner.os }}-v3
          restore-keys: |
            flutter-${{ steps.detect_flutter.outputs.flutter_version }}-${{ runner.os }}-
            flutter-stable-${{ runner.os }}-

      # =========================
      # SETUP FLUTTER (dynamic version)
      # =========================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "${{ steps.detect_flutter.outputs.flutter_version }}"
          channel: "stable"
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ steps.detect_flutter.outputs.flutter_version }}

      # =========================
      # PRE-WARM FLUTTER
      # =========================
      - name: Pre-warm Flutter (fast precache)
        run: |
          flutter config --no-analytics --no-cli-animations
          flutter precache --android --no-ios --no-web --no-linux --no-windows --no-macos 2>/dev/null || true
          ACTUAL=$(flutter --version 2>&1 | grep -oE 'Flutter [0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "✅ Actual: $ACTUAL | Target: ${{ steps.detect_flutter.outputs.flutter_version }}"

      # =========================
      # CACHE: Pub packages
      # =========================
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            /opt/pub-cache
            ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}-v2
          restore-keys: |
            pub-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}-
            pub-${{ runner.os }}-

      # =========================
      # CACHE: Gradle
      # =========================
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/daemon
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}-v2
          restore-keys: |
            gradle-${{ runner.os }}-

      # =========================
      # CACHE: Android build
      # =========================
      - name: Cache Android build outputs
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PROJECT_DIR }}/.dart_tool
            ${{ env.PROJECT_DIR }}/build/intermediates
          key: android-build-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}-v1
          restore-keys: |
            android-build-${{ runner.os }}-

      # =========================
      # ANALYZE (only if requested)
      # =========================
      - name: Analyze Project Code
        if: ${{ github.event.inputs.only_analyze == 'true' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "pubspec.yaml" ]; then
            flutter analyze > analyze_report.txt 2>&1 || true
            echo "[RESULT_ANALYZE]"
            cat analyze_report.txt
            echo "[END_RESULT_ANALYZE]"
          else
            echo "[RESULT_ANALYZE]"
            echo "❌ pubspec.yaml tidak ditemukan."
            echo "[END_RESULT_ANALYZE]"
          fi
          exit 1

      # =========================
      # PUB GET — robust dengan fallback
      # =========================
      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f "pubspec.yaml" ]; then
            echo "☕ Bukan project Flutter standar, skip pub get!"
            exit 0
          fi

          echo "▶ flutter pub get (Flutter ${{ steps.detect_flutter.outputs.flutter_version }})..."
          PUB_LOG=$(flutter pub get --no-precompile 2>&1 | tee /tmp/pubget_out.log; true)
          cat /tmp/pubget_out.log | tail -8

          if grep -qE "Failed to update packages|Try using the Flutter SDK version" /tmp/pubget_out.log; then
            SUGGESTED=$(grep -oE 'Flutter SDK version: [0-9]+\.[0-9]+(\.[0-9]+)?' /tmp/pubget_out.log | \
              grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1 || true)
            echo ""
            echo "⚠️======================================================"
            echo "⚠️ pub get GAGAL — SDK version mismatch!"
            echo "⚠️ Project butuh Flutter: $SUGGESTED"
            echo "⚠️ Workflow pakai Flutter: ${{ steps.detect_flutter.outputs.flutter_version }}"
            echo "⚠️ Cek format constraint di pubspec.yaml:"
            grep -A 10 '^environment:' pubspec.yaml || true
            echo "⚠️======================================================"
            echo ""
            echo "→ Mencoba hapus lock dan retry..."
            rm -rf .dart_tool pubspec.lock
            flutter pub get 2>&1 | tail -10
            if grep -qE "Failed to update|error" /tmp/pubget_out.log; then
              echo "❌ Pub get masih gagal"
              exit 1
            fi
          fi

          echo "✅ pub get done"

      # =========================
      # BUILD APK
      # =========================
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "▶ Mode: ${{ github.event.inputs.build_type }}"
          echo "▶ Flutter: ${{ steps.detect_flutter.outputs.flutter_version }}"
          if [ -f "pubspec.yaml" ]; then
            flutter build apk \
              --${{ github.event.inputs.build_type }} \
              --no-pub \
              --suppress-analytics \
              --no-tree-shake-icons \
              2>&1 | tail -20
          else
            GRADLE_PATH=$(find . -name "gradlew" | head -n 1)
            if [ -z "$GRADLE_PATH" ]; then
              echo "❌ ERROR: gradlew tidak ditemukan!"
              exit 1
            fi
            GRADLE_DIR=$(dirname "$GRADLE_PATH")
            cd "$GRADLE_DIR"
            chmod +x gradlew
            if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
              ./gradlew assembleDebug \
                --parallel --build-cache --no-daemon \
                --configuration-cache 2>&1 | tail -20
            else
              ./gradlew assembleRelease \
                --parallel --build-cache --no-daemon \
                --configuration-cache 2>&1 | tail -20
            fi
          fi

      # =========================
      # CHECK APK
      # =========================
      - name: Check APK Output
        run: |
          APK_FOUND=$(find $GITHUB_WORKSPACE -name "*.apk" | head -n 1)
          if [ -z "$APK_FOUND" ]; then
            echo "❌ APK tidak ditemukan."
            exit 1
          fi
          APK_REL=$(echo "$APK_FOUND" | sed "s|$GITHUB_WORKSPACE/||")
          echo "✅ APK: $APK_REL ($(du -sh "$APK_FOUND" | cut -f1))"
          echo "APK_PATH=$APK_REL" >> $GITHUB_ENV
          echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      # =========================
      # UPLOAD APK
      # =========================
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: ${{ env.PROJECT_DIR }}/${{ env.APK_PATH }}
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
