name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter"
        required: true
      tag:
        description: "Tag build"
        required: true
      build_type:
        description: "debug / release"
        required: true
        default: "release"
      only_analyze:
        description: "Hanya jalankan analyze (true/false)"
        required: false
        default: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 7

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      PUB_CACHE: /opt/pub-cache
      GRADLE_USER_HOME: /opt/gradle-home
      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=false
        -Dorg.gradle.parallel=true
        -Dorg.gradle.caching=true
        -Dorg.gradle.configureondemand=true
        -Dorg.gradle.workers.max=4
        -Dorg.gradle.jvmargs=-Xmx4g -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+HeapDumpOnOutOfMemoryError
        -Dkotlin.incremental=false
        -Dkotlin.compiler.execution.strategy=in-process
        -Dkotlin.daemon.jvm.options=-Xmx2g
        -XX:MaxMetaspaceSize=512m
      JAVA_OPTS: "-Xmx4g -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
      FLUTTER_ROOT: /opt/hostedtoolcache/flutter
      # Nonaktifkan telemetry & analytics Flutter biar ga buang waktu
      FLUTTER_CLI_ANALYTICS: "false"
      FLUTTER_SUPPRESS_ANALYTICS: "true"
      DART_DISABLE_ANALYTICS: "true"
      # R8/D8 speed
      ANDROID_BUILD_CACHE_DIR: /opt/android-build-cache

    steps:

      # =========================
      # SETUP NODE
      # =========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # =========================
      # SETUP JAVA
      # =========================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # =========================
      # CACHE PUB PACKAGES
      # =========================
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: /opt/pub-cache
          key: pub-v3-${{ runner.os }}-${{ hashFiles('**/pubspec.lock', '**/pubspec.yaml') }}
          restore-keys: |
            pub-v3-${{ runner.os }}-
            pub-v2-${{ runner.os }}-

      # =========================
      # CACHE GRADLE
      # =========================
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            /opt/gradle-home/caches
            /opt/gradle-home/wrapper
            /opt/android-build-cache
          key: gradle-v3-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-v3-${{ runner.os }}-
            gradle-v2-${{ runner.os }}-

      # =========================
      # CACHE ANDROID SDK BUILD TOOLS
      # =========================
      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            $HOME/.android/build-cache
            $HOME/.android/cache
          key: android-sdk-${{ runner.os }}-v2
          restore-keys: |
            android-sdk-${{ runner.os }}-

      # =========================
      # DOWNLOAD ZIP
      # =========================
      - name: Download ZIP project
        run: |
          ZIP_URL="${{ github.event.inputs.zip_url }}"
          echo "📥 URL: $ZIP_URL"

          if echo "$ZIP_URL" | grep -q "api.github.com"; then
            echo "🔐 GitHub API asset URL"
            curl -fsSL \
              -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
              -H "Accept: application/octet-stream" \
              -L "$ZIP_URL" -o project.zip \
              --retry 3 --retry-delay 2 \
              --connect-timeout 20 --max-time 120
          elif echo "$ZIP_URL" | grep -q "github.com.*releases/download"; then
            echo "🔐 GitHub Release download URL"
            curl -fsSL \
              -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
              -H "Accept: application/octet-stream" \
              -L "$ZIP_URL" -o project.zip \
              --retry 3 --retry-delay 2 \
              --connect-timeout 20 --max-time 120
          else
            echo "🌐 Public URL"
            curl -fsSL -L "$ZIP_URL" -o project.zip \
              --retry 3 --retry-delay 2 \
              --connect-timeout 20 --max-time 120
          fi

          if [ ! -f project.zip ] || [ ! -s project.zip ]; then
            echo "❌ File ZIP tidak ada atau kosong!"
            echo "💡 Cek: PAT_TOKEN di GitHub Secrets sudah di-set dan belum expired (scope: repo)"
            exit 1
          fi

          if ! file project.zip | grep -qi "zip"; then
            echo "❌ File bukan ZIP valid!"
            echo "📄 File type: $(file project.zip)"
            if file project.zip | grep -qi "html\|text"; then
              echo "📄 Content: $(head -c 300 project.zip)"
              echo "💡 Dapat HTML error page — PAT_TOKEN kemungkinan invalid/expired"
            fi
            exit 1
          fi

          echo "✅ ZIP valid ($(du -sh project.zip | cut -f1))"

      # =========================
      # EXTRACT ZIP
      # =========================
      - name: Extract ZIP
        run: |
          unzip -q project.zip -d project_raw

          SUB_DIR_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type d | wc -l)
          FILE_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type f | wc -l)

          if [ "$SUB_DIR_COUNT" -eq 1 ] && [ "$FILE_COUNT" -eq 0 ]; then
            PROJECT_DIR=$(find project_raw -maxdepth 1 -mindepth 1 -type d | head -n 1)
          else
            PROJECT_DIR="project_raw"
          fi

          echo "✅ Project root: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          rm -f project.zip

      # =========================
      # DETECT FLUTTER VERSION dari pubspec.yaml
      # =========================
      - name: Detect Flutter version
        run: |
          PUBSPEC_PATH=$(find "$PROJECT_DIR" -name "pubspec.yaml" -maxdepth 3 | head -n 1)

          if [ -z "$PUBSPEC_PATH" ]; then
            echo "⚠️ pubspec.yaml tidak ditemukan, pakai latest stable"
            echo "FLUTTER_VERSION=" >> $GITHUB_ENV
            exit 0
          fi

          echo "📄 Found: $PUBSPEC_PATH"
          SDK_CONSTRAINT=$(grep -E "^\s+sdk:" "$PUBSPEC_PATH" | head -1 | sed "s/.*sdk:[[:space:]]*//" | tr -d "'\"\n")
          echo "🔍 SDK constraint: $SDK_CONSTRAINT"

          MIN_DART=$(echo "$SDK_CONSTRAINT" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "🎯 Min Dart required: $MIN_DART"

          FLUTTER_VER=""

          if [ -n "$MIN_DART" ]; then
            DART_MAJOR=$(echo "$MIN_DART" | cut -d. -f1)
            DART_MINOR=$(echo "$MIN_DART" | cut -d. -f2)

            if [ "$DART_MAJOR" -eq 3 ] && [ "$DART_MINOR" -le 7 ]; then
              FLUTTER_VER="3.29.3"
            elif [ "$DART_MAJOR" -eq 3 ] && [ "$DART_MINOR" -eq 8 ]; then
              FLUTTER_VER=""
            else
              FLUTTER_VER=""
            fi
          fi

          echo "FLUTTER_VERSION=$FLUTTER_VER" >> $GITHUB_ENV
          if [ -z "$FLUTTER_VER" ]; then
            echo "✅ Flutter version: latest stable"
          else
            echo "✅ Flutter version pinned: $FLUTTER_VER"
          fi

      # =========================
      # SETUP FLUTTER
      # =========================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true
          cache-key: flutter-v4-${{ runner.os }}-${{ env.FLUTTER_VERSION || 'latest' }}

      # =========================
      # FLUTTER PRECACHE (android only, minimal)
      # =========================
      - name: Flutter precache
        run: |
          flutter --version
          flutter precache --android --no-ios --no-web --no-linux --no-windows --no-macos

      # =========================
      # ANALYZE ONLY MODE
      # =========================
      - name: Analyze Project Code
        if: ${{ github.event.inputs.only_analyze == 'true' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "pubspec.yaml" ]; then
            flutter pub get --no-precompile 2>&1 | tail -5 || true
            flutter analyze 2>&1 | tail -50 || true
          else
            echo "❌ pubspec.yaml tidak ditemukan."
          fi

      - name: Stop if Analyze Only
        if: ${{ github.event.inputs.only_analyze == 'true' }}
        run: |
          echo "✅ Analyze-only mode selesai."
          exit 0

      # =========================
      # PUB GET (single, no precompile for speed)
      # =========================
      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "📦 flutter pub get..."
            flutter pub get --no-precompile 2>&1 | tail -10
          else
            echo "⚠️ Bukan Flutter project standar, skip pub get"
          fi

      # =========================
      # BUILD APK (single call, optimized)
      # =========================
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          START_TS=$(date +%s)
          echo "🔨 Mode: $BUILD_TYPE"

          if [ -f "pubspec.yaml" ]; then
            # Single build call — no double build
            flutter build apk --$BUILD_TYPE \
              --no-pub \
              --suppress-analytics \
              --no-tree-shake-icons \
              --split-debug-info=/tmp/debug-info \
              2>&1 | grep -Ev "^Note:|^Downloading|^Running Gradle|^Resolving|^✓ Built"

            # Validasi output
            APK_FILE=$(find . -name "*.apk" ! -name "*unsigned*" | head -1)
            if [ -z "$APK_FILE" ]; then
              APK_FILE=$(find . -name "*.apk" | head -1)
            fi
            if [ -z "$APK_FILE" ]; then
              echo "❌ APK tidak ditemukan setelah build"
              exit 1
            fi
            DURATION=$(( $(date +%s) - START_TS ))
            echo "✅ BUILD OK — ${DURATION}s — $(basename $APK_FILE) ($(du -sh $APK_FILE | cut -f1))"
          else
            # Native Gradle path
            GRADLE_PATH=$(find . -name "gradlew" | head -n 1)
            if [ -z "$GRADLE_PATH" ]; then
              echo "❌ gradlew tidak ditemukan!"
              exit 1
            fi
            GRADLE_DIR=$(dirname "$GRADLE_PATH")
            cd "$GRADLE_DIR"
            chmod +x gradlew
            echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties

            [ "$BUILD_TYPE" = "debug" ] && TASK="assembleDebug" || TASK="assembleRelease"

            ./gradlew "$TASK" \
              --parallel \
              --build-cache \
              --configure-on-demand \
              --no-daemon \
              --warning-mode=none \
              -x test \
              -x lint \
              2>&1 | grep -Ev "^Note:|^Download|Resolving"

            DURATION=$(( $(date +%s) - START_TS ))
            echo "✅ BUILD OK — ${DURATION}s"
          fi

      # =========================
      # CHECK & COLLECT APK
      # =========================
      - name: Check APK Output
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type }}"

          if [ "$BUILD_TYPE" = "debug" ]; then
            APK_FOUND=$(find "${{ env.PROJECT_DIR }}" -name "*debug*.apk" ! -name "*unsigned*" 2>/dev/null | head -1)
            [ -z "$APK_FOUND" ] && APK_FOUND=$(find "${{ env.PROJECT_DIR }}" -name "*debug*.apk" 2>/dev/null | head -1)
          else
            APK_FOUND=$(find "${{ env.PROJECT_DIR }}" -name "*release*.apk" ! -name "*unsigned*" 2>/dev/null | head -1)
            [ -z "$APK_FOUND" ] && APK_FOUND=$(find "${{ env.PROJECT_DIR }}" -name "*release*.apk" 2>/dev/null | head -1)
          fi

          [ -z "$APK_FOUND" ] && APK_FOUND=$(find "${{ env.PROJECT_DIR }}" -name "*.apk" 2>/dev/null | head -1)

          if [ -z "$APK_FOUND" ]; then
            echo "❌ APK tidak ditemukan!"
            exit 1
          fi

          APK_ABS=$(realpath "$APK_FOUND")
          APK_SIZE=$(du -sh "$APK_ABS" | cut -f1)
          echo "✅ APK: $(basename $APK_ABS) ($APK_SIZE)"
          echo "APK_ABS_PATH=$APK_ABS" >> $GITHUB_ENV

      # =========================
      # PRESS APK
      # =========================
      - name: Press APK
        run: |
          APK_PATH="${{ env.APK_ABS_PATH }}"
          PRESSED_PATH="${APK_PATH%.apk}_pressed.apk"

          # Pastikan adm-zip tersedia
          node -e "require('adm-zip')" 2>/dev/null || npm install --prefer-offline adm-zip 2>/dev/null || npm install adm-zip

          node - "$APK_PATH" "$PRESSED_PATH" << 'NODEEOF'
          const fs   = require("fs");
          const zlib = require("zlib");

          const inputApk  = process.argv[2];
          const outputApk = process.argv[3];

          // ─── CRC32 table ─────────────────────────────────────────────────────────
          const T = new Uint32Array(256);
          for (let i = 0; i < 256; i++) {
            let c = i;
            for (let j = 0; j < 8; j++) c = c & 1 ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
            T[i] = c;
          }
          function crc32(b) {
            let c = 0xffffffff;
            for (let i = 0; i < b.length; i++) c = T[(c ^ b[i]) & 0xff] ^ (c >>> 8);
            return (c ^ 0xffffffff) >>> 0;
          }

          // ─── Detect APK v2/v3 signing block ──────────────────────────────────────
          function hasSigning(p) {
            try {
              const fd  = fs.openSync(p, "r");
              const sz  = fs.fstatSync(fd).size;
              const buf = Buffer.alloc(Math.min(65558, sz));
              fs.readSync(fd, buf, 0, buf.length, sz - buf.length);
              let off = -1;
              for (let i = buf.length - 22; i >= 0; i--) {
                if (buf[i] === 0x50 && buf[i+1] === 0x4b && buf[i+2] === 0x05 && buf[i+3] === 0x06) {
                  off = i;
                  break;
                }
              }
              if (off < 0) { fs.closeSync(fd); return false; }
              const cd = buf.readUInt32LE(off + 16);
              if (cd < 24) { fs.closeSync(fd); return false; }
              const magic = Buffer.alloc(16);
              fs.readSync(fd, magic, 0, 16, cd - 16);
              fs.closeSync(fd);
              return magic.toString("utf8") === "APK Sig Block 42";
            } catch (e) {
              return false;
            }
          }

          // ─── File patterns: always STORE (no compress) ───────────────────────────
          const STORE = [
            /\.png$/i, /\.jpg$/i, /\.jpeg$/i, /\.webp$/i, /\.gif$/i,
            /\.mp4$/i, /\.mp3$/i, /\.ogg$/i, /\.wav$/i,
            /\.so$/i,  /\.dex$/i, /\.arsc$/i,
            /\.zip$/i, /\.jar$/i, /\.class$/i
          ];

          // ─── Junk files: skip sama sekali ────────────────────────────────────────
          const JUNK = [
            /\.DS_Store$/i, /Thumbs\.db$/i, /^__MACOSX\//, /\.tmp$/i,
            /\.log$/i, /~$/, /\.bak$/i
          ];

          // ─── Build raw ZIP bytes ─────────────────────────────────────────────────
          function buildZip(files) {
            const now = new Date();
            const dt  = (now.getHours() << 11 | now.getMinutes() << 5 | Math.floor(now.getSeconds() / 2));
            const dd  = ((now.getFullYear() - 1980) << 9 | (now.getMonth() + 1) << 5 | now.getDate());

            const localParts = [];
            const cdParts    = [];
            const offsets    = [];
            let pos = 0;

            for (const f of files) {
              const nb = Buffer.from(f.name, "utf8");
              offsets.push(pos);

              // Local File Header
              const lh = Buffer.allocUnsafe(30 + nb.length);
              lh.writeUInt32LE(0x04034b50, 0);
              lh.writeUInt16LE(20, 4);
              lh.writeUInt16LE(f.method === 8 ? 2 : 0, 6);
              lh.writeUInt16LE(f.method, 8);
              lh.writeUInt16LE(dt, 10);
              lh.writeUInt16LE(dd, 12);
              lh.writeUInt32LE(f.crc, 14);
              lh.writeUInt32LE(f.comp.length, 18);
              lh.writeUInt32LE(f.unc, 22);
              lh.writeUInt16LE(nb.length, 26);
              lh.writeUInt16LE(0, 28);
              nb.copy(lh, 30);
              localParts.push(lh, f.comp);
              pos += 30 + nb.length + f.comp.length;

              // Central Directory entry
              const ce = Buffer.allocUnsafe(46 + nb.length);
              ce.writeUInt32LE(0x02014b50, 0);
              ce.writeUInt16LE(20, 4);
              ce.writeUInt16LE(20, 6);
              ce.writeUInt16LE(f.method === 8 ? 2 : 0, 8);
              ce.writeUInt16LE(f.method, 10);
              ce.writeUInt16LE(dt, 12);
              ce.writeUInt16LE(dd, 14);
              ce.writeUInt32LE(f.crc, 16);
              ce.writeUInt32LE(f.comp.length, 20);
              ce.writeUInt32LE(f.unc, 24);
              ce.writeUInt16LE(nb.length, 28);
              ce.writeUInt16LE(0, 30);
              ce.writeUInt16LE(0, 32);
              ce.writeUInt16LE(0, 34);
              ce.writeUInt16LE(0, 36);
              ce.writeUInt32LE(f.method === 8 ? 0x20 : 0, 38);
              ce.writeUInt32LE(offsets[offsets.length - 1], 42);
              nb.copy(ce, 46);
              cdParts.push(ce);
            }

            const cdb  = Buffer.concat(cdParts);
            const eocd = Buffer.allocUnsafe(22);
            eocd.writeUInt32LE(0x06054b50, 0);
            eocd.writeUInt16LE(0, 4);
            eocd.writeUInt16LE(0, 6);
            eocd.writeUInt16LE(files.length, 8);
            eocd.writeUInt16LE(files.length, 10);
            eocd.writeUInt32LE(cdb.length, 12);
            eocd.writeUInt32LE(pos, 16);
            eocd.writeUInt16LE(0, 20);

            return Buffer.concat([...localParts, cdb, eocd]);
          }

          // ─── MAIN ─────────────────────────────────────────────────────────────────
          const before = fs.statSync(inputApk).size;
          console.log("Input : " + (before / 1024 / 1024).toFixed(2) + " MB");

          // Kalau APK sudah signed → jangan sentuh, langsung pakai original
          if (hasSigning(inputApk)) {
            console.log("APK sudah signed (APK Sig Block 42 detected) — skip press, pakai original");
            fs.copyFileSync(inputApk, outputApk);
            const after = fs.statSync(outputApk).size;
            console.log("Output: " + (after / 1024 / 1024).toFixed(2) + " MB");
            console.log("✅ Press selesai (original copy)");
            process.exit(0);
          }

          let entries;
          try {
            const AdmZip = require("adm-zip");
            const zip    = new AdmZip(inputApk);
            entries = zip.getEntries()
              .filter(e => !e.isDirectory && !JUNK.some(p => p.test(e.entryName)))
              .map(e => {
                const raw = e.getData();
                const ck  = crc32(raw);
                const shouldStore = STORE.some(p => p.test(e.entryName));
                if (shouldStore) {
                  return { name: e.entryName, comp: raw, method: 0, crc: ck, unc: raw.length };
                }
                try {
                  // level 6 = balance speed vs size; memLevel 9 = faster
                  const deflated = zlib.deflateRawSync(raw, { level: 6, memLevel: 9 });
                  if (deflated.length < raw.length) {
                    return { name: e.entryName, comp: deflated, method: 8, crc: ck, unc: raw.length };
                  }
                } catch (_) {}
                return { name: e.entryName, comp: raw, method: 0, crc: ck, unc: raw.length };
              });
          } catch (e) {
            console.log("adm-zip error (" + e.message + ") — pakai original");
            fs.copyFileSync(inputApk, outputApk);
            process.exit(0);
          }

          const out   = buildZip(entries);
          fs.writeFileSync(outputApk, out);

          const after = fs.statSync(outputApk).size;
          const saved = Math.max(0, before - after);
          console.log("Output: " + (after / 1024 / 1024).toFixed(2) + " MB");
          console.log("Hemat : " + (saved / 1024 / 1024).toFixed(2) + " MB (" + (before > 0 ? ((saved / before) * 100).toFixed(1) : 0) + "%)");
          console.log("✅ Press selesai");
          NODEEOF

          # Update path ke pressed APK jika berhasil dibuat
          if [ -f "$PRESSED_PATH" ] && [ -s "$PRESSED_PATH" ]; then
            echo "APK_ABS_PATH=$PRESSED_PATH" >> $GITHUB_ENV
            echo "✅ APK path updated → $(basename $PRESSED_PATH) ($(du -sh $PRESSED_PATH | cut -f1))"
          else
            echo "⚠️ Pressed APK tidak terbentuk, tetap pakai original: $(basename $APK_PATH)"
          fi

      # =========================
      # UPLOAD APK ARTIFACT
      # =========================
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: ${{ env.APK_ABS_PATH }}
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
