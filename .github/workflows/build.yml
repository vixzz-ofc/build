name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter"
        required: true
      tag:
        description: "Tag build"
        required: true
      build_type:
        description: "debug / release"
        required: true
        default: "release"
      only_analyze:
        description: "Hanya jalankan analyze (true/false)"
        required: false
        default: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      PUB_CACHE: /opt/pub-cache
      GRADLE_USER_HOME: /opt/gradle-home
      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=false
        -Dorg.gradle.parallel=true
        -Dorg.gradle.caching=true
        -Dorg.gradle.configureondemand=true
        -Dorg.gradle.workers.max=4
        -XX:MaxMetaspaceSize=512m
        -Xmx4g
      FLUTTER_ROOT: /opt/hostedtoolcache/flutter

    steps:

      # =========================
      # SETUP NODE
      # =========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # =========================
      # SETUP JAVA
      # =========================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # =========================
      # CACHE PUB PACKAGES
      # =========================
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: /opt/pub-cache
          key: pub-v2-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            pub-v2-${{ runner.os }}-

      # =========================
      # CACHE GRADLE
      # =========================
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            /opt/gradle-home/caches
            /opt/gradle-home/wrapper
          key: gradle-v2-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-v2-${{ runner.os }}-

      # =========================
      # CACHE ANDROID SDK BUILD TOOLS
      # =========================
      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            $HOME/.android/build-cache
            $HOME/.android/cache
          key: android-sdk-${{ runner.os }}-v1
          restore-keys: |
            android-sdk-${{ runner.os }}-

      # =========================
      # DOWNLOAD ZIP (sebelum Flutter setup)
      # Tujuan: extract pubspec.yaml dulu agar bisa deteksi Flutter version yang dibutuhkan
      # =========================
      - name: Download ZIP project
        run: |
          ZIP_URL="${{ github.event.inputs.zip_url }}"
          echo "📥 URL: $ZIP_URL"

          if echo "$ZIP_URL" | grep -q "api.github.com"; then
            echo "🔐 GitHub API asset URL"
            curl -fsSL \
              -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
              -H "Accept: application/octet-stream" \
              -L \
              "$ZIP_URL" \
              -o project.zip \
              --retry 3 --retry-delay 3 \
              --connect-timeout 30 \
              --max-time 180
          elif echo "$ZIP_URL" | grep -q "github.com.*releases/download"; then
            echo "🔐 GitHub Release download URL"
            curl -fsSL \
              -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
              -H "Accept: application/octet-stream" \
              -L \
              "$ZIP_URL" \
              -o project.zip \
              --retry 3 --retry-delay 3 \
              --connect-timeout 30 \
              --max-time 180
          else
            echo "🌐 Public URL"
            curl -fsSL -L \
              "$ZIP_URL" \
              -o project.zip \
              --retry 3 --retry-delay 3 \
              --connect-timeout 30 \
              --max-time 180
          fi

          if [ ! -f project.zip ] || [ ! -s project.zip ]; then
            echo "❌ File ZIP tidak ada atau kosong!"
            echo "💡 Cek: PAT_TOKEN di GitHub Secrets sudah di-set dan belum expired (scope: repo)"
            exit 1
          fi

          if ! file project.zip | grep -qi "zip"; then
            echo "❌ File bukan ZIP valid!"
            echo "📄 File type: $(file project.zip)"
            if file project.zip | grep -qi "html\|text"; then
              echo "📄 Content: $(head -c 300 project.zip)"
              echo "💡 Dapat HTML error page — PAT_TOKEN kemungkinan invalid/expired"
            fi
            exit 1
          fi

          echo "✅ ZIP valid ($(du -sh project.zip | cut -f1))"

      # =========================
      # EXTRACT ZIP
      # =========================
      - name: Extract ZIP
        run: |
          unzip -q project.zip -d project_raw

          SUB_DIR_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type d | wc -l)
          FILE_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type f | wc -l)

          if [ "$SUB_DIR_COUNT" -eq 1 ] && [ "$FILE_COUNT" -eq 0 ]; then
            PROJECT_DIR=$(find project_raw -maxdepth 1 -mindepth 1 -type d | head -n 1)
          else
            PROJECT_DIR="project_raw"
          fi

          echo "✅ Project root: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          rm -f project.zip

      # =========================
      # DETECT FLUTTER VERSION dari pubspec.yaml
      # Baca constraint sdk project, resolve Flutter version yang tepat
      # =========================
      - name: Detect Flutter version
        run: |
          PUBSPEC_PATH=$(find "$PROJECT_DIR" -name "pubspec.yaml" -maxdepth 3 | head -n 1)

          if [ -z "$PUBSPEC_PATH" ]; then
            echo "⚠️ pubspec.yaml tidak ditemukan, pakai latest stable"
            echo "FLUTTER_VERSION=" >> $GITHUB_ENV
            exit 0
          fi

          echo "📄 Found: $PUBSPEC_PATH"

          # Ambil flutter SDK constraint dari pubspec.yaml
          # Format: sdk: '>=3.8.1 <4.0.0' atau sdk: ^3.8.1
          SDK_CONSTRAINT=$(grep -E "^\s+sdk:" "$PUBSPEC_PATH" | head -1 | sed "s/.*sdk:[[:space:]]*//" | tr -d "'\"\n")
          echo "🔍 SDK constraint: $SDK_CONSTRAINT"

          # Cek apakah ada .flutter-version atau flutter.constraints di pubspec
          FLUTTER_CONSTRAINT=$(grep -E "^\s+flutter:" "$PUBSPEC_PATH" | grep -v "flutter_lints\|flutter_test" | head -1 | sed "s/.*flutter:[[:space:]]*//" | tr -d "'\"\n" || echo "")

          # Parse minimum Dart version dari constraint
          # Contoh: '>=3.8.1 <4.0.0' → 3.8.1
          MIN_DART=$(echo "$SDK_CONSTRAINT" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "🎯 Min Dart required: $MIN_DART"

          # Map Dart version → Flutter version
          # Dart 3.8.x → Flutter 3.32.x (min 3.32.1 untuk Dart 3.8.1)
          # Dart 3.9.x → Flutter 3.33.x+
          # Kalau tidak bisa parse → pakai latest stable
          FLUTTER_VER=""

          if [ -n "$MIN_DART" ]; then
            DART_MAJOR=$(echo "$MIN_DART" | cut -d. -f1)
            DART_MINOR=$(echo "$MIN_DART" | cut -d. -f2)
            DART_PATCH=$(echo "$MIN_DART" | cut -d. -f3)

            if [ "$DART_MAJOR" -eq 3 ] && [ "$DART_MINOR" -le 7 ]; then
              # Dart <= 3.7.x → Flutter 3.29.x sudah cukup, tapi pakai 3.29.3
              FLUTTER_VER="3.29.3"
            elif [ "$DART_MAJOR" -eq 3 ] && [ "$DART_MINOR" -eq 8 ]; then
              # Dart 3.8.x → butuh Flutter >= 3.32.1
              # Pakai latest stable (tidak pin) biar selalu dapat yang support
              FLUTTER_VER=""
            else
              # Dart 3.9+ → pakai latest stable
              FLUTTER_VER=""
            fi
          fi

          echo "FLUTTER_VERSION=$FLUTTER_VER" >> $GITHUB_ENV

          if [ -z "$FLUTTER_VER" ]; then
            echo "✅ Flutter version: latest stable (auto-resolve)"
          else
            echo "✅ Flutter version pinned: $FLUTTER_VER"
          fi

      # =========================
      # SETUP FLUTTER (version dari deteksi atau latest stable)
      # =========================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true
          cache-key: flutter-v3-${{ runner.os }}-${{ env.FLUTTER_VERSION || 'latest' }}

      # =========================
      # FLUTTER PRECACHE
      # =========================
      - name: Flutter precache
        run: |
          flutter --version
          flutter precache --android --no-ios --no-web --no-linux --no-windows --no-macos

      # =========================
      # ANALYZE (opsional)
      # =========================
      - name: Analyze Project Code
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "pubspec.yaml" ]; then
            flutter pub get --no-precompile 2>&1 | tail -5 || true
            flutter analyze > analyze_report.txt 2>&1 || true
            echo "[RESULT_ANALYZE]"
            cat analyze_report.txt
            echo "[END_RESULT_ANALYZE]"
            rm -f analyze_report.txt
          else
            echo "[RESULT_ANALYZE]"
            echo "❌ pubspec.yaml tidak ditemukan."
            echo "[END_RESULT_ANALYZE]"
          fi

      - name: Stop if Analyze Only
        if: ${{ github.event.inputs.only_analyze == 'true' }}
        run: |
          echo "Analyze-only mode aktif."
          exit 1

      # =========================
      # PUB GET
      # =========================
      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "pubspec.yaml" ]; then
            flutter pub get --no-precompile 2>&1 | tail -10
          else
            echo "⚠️ Bukan Flutter project standar, skip pub get"
          fi

      # =========================
      # BUILD APK
      # =========================
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          echo "Mode: $BUILD_TYPE"

          if [ -f "pubspec.yaml" ]; then
            flutter build apk --$BUILD_TYPE \
              --no-pub \
              --suppress-analytics \
              --no-tree-shake-icons \
              --split-debug-info=/tmp/debug-info \
              2>&1 | grep -v "^Note:" | grep -v "^Downloading" | grep -v "^Running" || true

            flutter build apk --$BUILD_TYPE \
              --no-pub \
              --suppress-analytics
          else
            GRADLE_PATH=$(find . -name "gradlew" | head -n 1)
            if [ -z "$GRADLE_PATH" ]; then
              echo "❌ gradlew tidak ditemukan!"
              exit 1
            fi
            GRADLE_DIR=$(dirname "$GRADLE_PATH")
            cd "$GRADLE_DIR"
            chmod +x gradlew

            if [ "$BUILD_TYPE" = "debug" ]; then
              ./gradlew assembleDebug \
                --parallel \
                --build-cache \
                --configure-on-demand \
                --no-daemon \
                -x test \
                -x lint
            else
              ./gradlew assembleRelease \
                --parallel \
                --build-cache \
                --configure-on-demand \
                --no-daemon \
                -x test \
                -x lint
            fi
          fi

      # =========================
      # CHECK APK
      # =========================
      - name: Check APK Output
        run: |
          APK_FOUND=$(find ${{ env.PROJECT_DIR }} -name "*.apk" | head -n 1)
          if [ -z "$APK_FOUND" ]; then
            echo "❌ APK tidak ditemukan!"
            exit 1
          fi
          APK_REL=$(realpath --relative-to="${{ env.PROJECT_DIR }}" "$APK_FOUND")
          echo "✅ APK: $APK_REL ($(du -sh "$APK_FOUND" | cut -f1))"
          echo "APK_PATH=$APK_REL" >> $GITHUB_ENV

      # =========================
      # UPLOAD APK ARTIFACT
      # =========================
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: ${{ env.PROJECT_DIR }}/${{ env.APK_PATH }}
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
