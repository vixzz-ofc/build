name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter"
        required: true
      tag:
        description: "Tag build"
        required: true
      build_type:
        description: "debug / release"
        required: true
        default: "release"
      only_analyze:
        description: "Hanya jalankan analyze (true/false)"
        required: false
        default: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      PUB_CACHE: /opt/pub-cache
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.configureondemand=true -Dkotlin.incremental=false -Dorg.gradle.jvmargs=-Xmx4g"

    steps:

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Download ZIP project
        run: |
          curl -L \
            -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "${{ github.event.inputs.zip_url }}" \
            -o project.zip \
            --retry 3 --retry-delay 2 \
            --connect-timeout 30 \
            -w "\n=== HTTP: %{http_code} | Size: %{size_download} bytes ===\n"
          if ! unzip -t project.zip > /dev/null 2>&1; then
            echo "❌ File bukan ZIP valid!"
            xxd project.zip | head -4
            exit 1
          fi
          echo "✅ ZIP valid: $(ls -lh project.zip | awk '{print $5}')"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # Extract dulu sebelum setup Flutter — biar bisa detect versi
      - name: Extract ZIP
        run: |
          unzip -q project.zip -d project_raw
          rm project.zip

          SUB_DIR_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type d | wc -l)
          FILE_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type f | wc -l)

          if [ "$SUB_DIR_COUNT" -eq 1 ] && [ "$FILE_COUNT" -eq 0 ]; then
            PROJECT_DIR=$(find project_raw -maxdepth 1 -mindepth 1 -type d | head -n 1)
          else
            PROJECT_DIR="project_raw"
          fi

          echo "✅ Project root: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      # Detect Flutter version dari pubspec SEBELUM setup Flutter
      - name: Detect Flutter version
        id: detect_flutter
        run: |
          PUBSPEC="$PROJECT_DIR/pubspec.yaml"
          # Default: Flutter terbaru stable — kompatibel semua project modern
          FLUTTER_VER="3.47.6"

          if [ -f "$PUBSPEC" ]; then
            echo "=== environment block ==="
            grep -A 10 '^environment:' "$PUBSPEC" || true
            echo "========================="

            # Baca flutter constraint — pakai python3 buat parse YAML dengan benar
            FLUTTER_VER=$(python3 - "$PUBSPEC" "$FLUTTER_VER" <<'PYEOF'
import sys, re

pubspec_path = sys.argv[1]
default_ver  = sys.argv[2]

try:
    with open(pubspec_path, 'r') as f:
        content = f.read()

    # Cari environment block
    env_match = re.search(r'^environment:\s*\n((?:[ \t]+.+\n?)*)', content, re.MULTILINE)
    if not env_match:
        print(default_ver)
        sys.exit(0)

    env_block = env_match.group(1)

    # Cari baris flutter di dalam environment block
    flutter_match = re.search(r'flutter\s*:\s*["\']?([^"\'#\n]+)', env_block)
    if not flutter_match:
        print(default_ver)
        sys.exit(0)

    constraint = flutter_match.group(1).strip()

    # Extract semua versi number dari constraint
    versions = re.findall(r'(\d+)\.(\d+)(?:\.(\d+))?', constraint)
    if not versions:
        print(default_ver)
        sys.exit(0)

    # Ambil minimum version (versi pertama yang ada)
    major, minor, patch = versions[0]
    major, minor = int(major), int(minor)

    # Map ke Flutter stable yang tersedia
    if major > 3 or (major == 3 and minor >= 47):
        result = "3.47.6"
    elif major == 3 and minor >= 43:
        result = "3.43.0"
    elif major == 3 and minor >= 40:
        result = "3.40.0"
    elif major == 3 and minor >= 35:
        result = "3.40.0"
    elif major == 3 and minor >= 29:
        result = "3.32.0"
    elif major == 3 and minor >= 24:
        result = "3.27.4"
    elif major == 3 and minor >= 19:
        result = "3.22.0"
    else:
        result = default_ver

    print(result)

except Exception as e:
    import sys
    print(default_ver, file=sys.stderr)
    print(default_ver)
PYEOF
)
          fi

          echo "✅ Flutter version: $FLUTTER_VER"
          echo "FLUTTER_VERSION=$FLUTTER_VER" >> $GITHUB_ENV

      - name: Cache Flutter SDK
        id: flutter-cache
        uses: actions/cache@v4
        with:
          path: |
            /opt/flutter
            ~/.pub-cache
            /opt/pub-cache
          key: flutter-${{ env.FLUTTER_VERSION }}-${{ runner.os }}-v4
          restore-keys: |
            flutter-${{ env.FLUTTER_VERSION }}-${{ runner.os }}-
            flutter-stable-${{ runner.os }}-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "${{ env.FLUTTER_VERSION }}"
          channel: "stable"
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}

      - name: Pre-warm Flutter
        run: |
          flutter config --no-analytics --no-cli-animations
          flutter precache --android --no-ios --no-web --no-linux --no-windows --no-macos 2>/dev/null || true
          echo "✅ $(flutter --version 2>&1 | head -1)"

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            /opt/pub-cache
            ~/.pub-cache
          key: pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('**/pubspec.lock') }}-v2
          restore-keys: |
            pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-
            pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/daemon
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}-v2
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Android build outputs
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PROJECT_DIR }}/.dart_tool
            ${{ env.PROJECT_DIR }}/build/intermediates
          key: android-build-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}-v1
          restore-keys: |
            android-build-${{ runner.os }}-

      - name: Analyze Project Code
        if: ${{ github.event.inputs.only_analyze == 'true' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "pubspec.yaml" ]; then
            flutter analyze > analyze_report.txt 2>&1 || true
            echo "[RESULT_ANALYZE]"
            cat analyze_report.txt
            echo "[END_RESULT_ANALYZE]"
          else
            echo "[RESULT_ANALYZE]"
            echo "❌ pubspec.yaml tidak ditemukan."
            echo "[END_RESULT_ANALYZE]"
          fi
          exit 1

      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f "pubspec.yaml" ]; then
            echo "☕ Bukan project Flutter standar, skip pub get!"
            exit 0
          fi

          echo "▶ flutter pub get (Flutter $FLUTTER_VERSION)..."
          flutter pub get --no-precompile 2>&1 | tee /tmp/pubget_out.log | tail -8

          if grep -qE "Failed to update packages|Try using the Flutter SDK version" /tmp/pubget_out.log; then
            SUGGESTED=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' /tmp/pubget_out.log | tail -1 || true)
            echo "❌ pub get GAGAL — SDK mismatch!"
            echo "   Project butuh: $SUGGESTED"
            echo "   Dipakai: $FLUTTER_VERSION"
            echo "   → Retry hapus lock..."
            rm -rf .dart_tool pubspec.lock
            flutter pub get 2>&1 | tee /tmp/pubget_retry.log | tail -10
            if grep -qE "Failed to update packages" /tmp/pubget_retry.log; then
              echo "❌ Pub get masih gagal!"
              cat /tmp/pubget_retry.log
              exit 1
            fi
          fi

          echo "✅ pub get done"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "▶ Mode: ${{ github.event.inputs.build_type }}"
          echo "▶ Flutter: $FLUTTER_VERSION"
          if [ -f "pubspec.yaml" ]; then
            flutter build apk \
              --${{ github.event.inputs.build_type }} \
              --no-pub \
              --suppress-analytics \
              --no-tree-shake-icons \
              2>&1 | tail -20
          else
            GRADLE_PATH=$(find . -name "gradlew" | head -n 1)
            if [ -z "$GRADLE_PATH" ]; then
              echo "❌ ERROR: gradlew tidak ditemukan!"
              exit 1
            fi
            GRADLE_DIR=$(dirname "$GRADLE_PATH")
            cd "$GRADLE_DIR"
            chmod +x gradlew
            if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
              ./gradlew assembleDebug \
                --parallel --build-cache --no-daemon \
                --configuration-cache 2>&1 | tail -20
            else
              ./gradlew assembleRelease \
                --parallel --build-cache --no-daemon \
                --configuration-cache 2>&1 | tail -20
            fi
          fi

      - name: Check APK Output
        run: |
          APK_FOUND=$(find $GITHUB_WORKSPACE -name "*.apk" | head -n 1)
          if [ -z "$APK_FOUND" ]; then
            echo "❌ APK tidak ditemukan."
            exit 1
          fi
          APK_REL=$(echo "$APK_FOUND" | sed "s|$GITHUB_WORKSPACE/||")
          echo "✅ APK: $APK_REL ($(du -sh "$APK_FOUND" | cut -f1))"
          echo "APK_PATH=$APK_REL" >> $GITHUB_ENV
          echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: ${{ env.PROJECT_DIR }}/${{ env.APK_PATH }}
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
