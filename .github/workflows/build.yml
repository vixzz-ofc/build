name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter"
        required: true
      tag:
        description: "Tag build"
        required: true
      build_type:
        description: "debug / release"
        required: true
        default: "release"
      only_analyze:
        description: "Hanya jalankan analyze (true/false)"
        required: false
        default: "false"
      flutter_version:
        description: "Flutter version override (kosongkan = auto detect)"
        required: false
        default: ""

jobs:
  # ══════════════════════════════════════════
  # JOB 1: Detect Flutter version dari pubspec
  # ══════════════════════════════════════════
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      flutter_version: ${{ steps.detect.outputs.flutter_version }}

    steps:
      - name: Download & extract pubspec only
        run: |
          curl -L \
            -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "${{ github.event.inputs.zip_url }}" \
            -o project.zip \
            --retry 3 --retry-delay 2 \
            --connect-timeout 30
          # Extract hanya pubspec.yaml
          unzip -q project.zip "*/pubspec.yaml" "pubspec.yaml" -d proj_detect 2>/dev/null || true
          unzip -q project.zip -d proj_detect_full 2>/dev/null || true
          find proj_detect proj_detect_full -name "pubspec.yaml" 2>/dev/null | head -5

      - name: Detect Flutter version
        id: detect
        run: |
          # Jika user provide manual override, langsung pakai
          MANUAL="${{ github.event.inputs.flutter_version }}"
          if [ -n "$MANUAL" ]; then
            echo "✅ Manual override: $MANUAL"
            echo "flutter_version=$MANUAL" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Cari pubspec.yaml
          PUBSPEC=$(find proj_detect proj_detect_full -name "pubspec.yaml" 2>/dev/null | head -1 || true)
          echo "pubspec found: $PUBSPEC"

          FLUTTER_VER="3.27.4"  # safe default — support Dart 3.6+, kompatibel luas

          if [ -n "$PUBSPEC" ] && [ -f "$PUBSPEC" ]; then
            echo "=== pubspec.yaml environment block ==="
            grep -A 15 '^environment:' "$PUBSPEC" || echo "(no environment block)"
            echo "======================================"

            # Ambil semua baris dari environment block
            ENV_BLOCK=$(awk '/^environment:/{f=1; next} f && /^[a-zA-Z]/{f=0} f{print}' "$PUBSPEC")
            echo "Environment block content:"
            echo "$ENV_BLOCK"

            # Cari baris yang mengandung 'flutter'
            FLUTTER_LINE=$(echo "$ENV_BLOCK" | grep -i 'flutter' | head -1 || true)
            echo "Flutter line: '$FLUTTER_LINE'"

            # Extract semua angka versi 3.x.x atau 3.x dari baris itu
            VER=$(echo "$FLUTTER_LINE" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || \
                  echo "$FLUTTER_LINE" | grep -oE '[0-9]+\.[0-9]+' | head -1 || true)
            echo "Version extracted: '$VER'"

            if [ -n "$VER" ]; then
              MAJOR=$(echo "$VER" | cut -d. -f1)
              MINOR=$(echo "$VER" | cut -d. -f2)
              echo "Major=$MAJOR Minor=$MINOR"

              if   [ "$MAJOR" -gt 3 ];                                    then FLUTTER_VER="3.47.6"
              elif [ "$MAJOR" -eq 3 ] && [ "$MINOR" -ge 47 ];            then FLUTTER_VER="3.47.6"
              elif [ "$MAJOR" -eq 3 ] && [ "$MINOR" -ge 43 ];            then FLUTTER_VER="3.43.0"
              elif [ "$MAJOR" -eq 3 ] && [ "$MINOR" -ge 40 ];            then FLUTTER_VER="3.40.0"
              elif [ "$MAJOR" -eq 3 ] && [ "$MINOR" -ge 35 ];            then FLUTTER_VER="3.40.0"
              elif [ "$MAJOR" -eq 3 ] && [ "$MINOR" -ge 29 ];            then FLUTTER_VER="3.32.0"
              elif [ "$MAJOR" -eq 3 ] && [ "$MINOR" -ge 24 ];            then FLUTTER_VER="3.27.4"
              elif [ "$MAJOR" -eq 3 ] && [ "$MINOR" -ge 19 ];            then FLUTTER_VER="3.22.0"
              else                                                          FLUTTER_VER="3.27.4"
              fi
            else
              echo "⚠️ Tidak bisa extract versi dari flutter line, coba raw scan..."
              # Scan semua versi angka di seluruh pubspec — ambil yang paling tinggi
              ALL_VERS=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' "$PUBSPEC" | sort -Vr | head -5 || true)
              echo "All versions in pubspec: $ALL_VERS"
            fi
          else
            echo "⚠️ pubspec.yaml tidak ditemukan, pakai default"
          fi

          echo "✅ Flutter version selected: $FLUTTER_VER"
          echo "flutter_version=$FLUTTER_VER" >> $GITHUB_OUTPUT

  # ══════════════════════════════════════════
  # JOB 2: Build (menggunakan versi dari job 1)
  # ══════════════════════════════════════════
  build:
    runs-on: ubuntu-latest
    needs: detect
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      PUB_CACHE: /opt/pub-cache
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.configureondemand=true -Dkotlin.incremental=false -Dorg.gradle.jvmargs=-Xmx4g"

    steps:

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Download ZIP project
        run: |
          curl -L \
            -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "${{ github.event.inputs.zip_url }}" \
            -o project.zip \
            --retry 3 --retry-delay 2 \
            --connect-timeout 30 \
            -w "\n=== HTTP: %{http_code} | Size: %{size_download} bytes ===\n"
          if ! unzip -t project.zip > /dev/null 2>&1; then
            echo "❌ File bukan ZIP valid!"
            xxd project.zip | head -4
            exit 1
          fi
          echo "✅ ZIP valid: $(ls -lh project.zip | awk '{print $5}')"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Extract ZIP
        run: |
          unzip -q project.zip -d project_raw
          rm project.zip

          SUB_DIR_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type d | wc -l)
          FILE_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type f | wc -l)

          if [ "$SUB_DIR_COUNT" -eq 1 ] && [ "$FILE_COUNT" -eq 0 ]; then
            PROJECT_DIR=$(find project_raw -maxdepth 1 -mindepth 1 -type d | head -n 1)
          else
            PROJECT_DIR="project_raw"
          fi

          echo "✅ Project root: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Cache Flutter SDK
        id: flutter-cache
        uses: actions/cache@v4
        with:
          path: |
            /opt/flutter
            ~/.pub-cache
            /opt/pub-cache
          key: flutter-${{ needs.detect.outputs.flutter_version }}-${{ runner.os }}-v4
          restore-keys: |
            flutter-${{ needs.detect.outputs.flutter_version }}-${{ runner.os }}-
            flutter-stable-${{ runner.os }}-

      - name: Setup Flutter ${{ needs.detect.outputs.flutter_version }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "${{ needs.detect.outputs.flutter_version }}"
          channel: "stable"
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ needs.detect.outputs.flutter_version }}

      - name: Pre-warm Flutter
        run: |
          flutter config --no-analytics --no-cli-animations
          flutter precache --android --no-ios --no-web --no-linux --no-windows --no-macos 2>/dev/null || true
          echo "✅ $(flutter --version 2>&1 | head -1)"

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            /opt/pub-cache
            ~/.pub-cache
          key: pub-${{ runner.os }}-${{ needs.detect.outputs.flutter_version }}-${{ hashFiles('**/pubspec.lock') }}-v2
          restore-keys: |
            pub-${{ runner.os }}-${{ needs.detect.outputs.flutter_version }}-
            pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/daemon
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}-v2
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Android build outputs
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PROJECT_DIR }}/.dart_tool
            ${{ env.PROJECT_DIR }}/build/intermediates
          key: android-build-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}-v1
          restore-keys: |
            android-build-${{ runner.os }}-

      - name: Analyze Project Code
        if: ${{ github.event.inputs.only_analyze == 'true' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "pubspec.yaml" ]; then
            flutter analyze > analyze_report.txt 2>&1 || true
            echo "[RESULT_ANALYZE]"
            cat analyze_report.txt
            echo "[END_RESULT_ANALYZE]"
          else
            echo "[RESULT_ANALYZE]"
            echo "❌ pubspec.yaml tidak ditemukan."
            echo "[END_RESULT_ANALYZE]"
          fi
          exit 1

      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f "pubspec.yaml" ]; then
            echo "☕ Bukan project Flutter standar, skip pub get!"
            exit 0
          fi

          echo "▶ flutter pub get (Flutter ${{ needs.detect.outputs.flutter_version }})..."
          flutter pub get --no-precompile 2>&1 | tee /tmp/pubget_out.log | tail -8

          if grep -qE "Failed to update packages|Try using the Flutter SDK version" /tmp/pubget_out.log; then
            SUGGESTED=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' /tmp/pubget_out.log | head -1 || true)
            echo "❌ pub get GAGAL"
            echo "   Project butuh: $SUGGESTED"
            echo "   Dipakai: ${{ needs.detect.outputs.flutter_version }}"
            echo "   → Retry tanpa lock..."
            rm -rf .dart_tool pubspec.lock
            flutter pub get 2>&1 | tee /tmp/pubget_retry.log | tail -10
            if grep -qE "Failed to update packages" /tmp/pubget_retry.log; then
              echo "❌ Masih gagal setelah retry"
              cat /tmp/pubget_retry.log
              exit 1
            fi
          fi

          echo "✅ pub get done"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "▶ Mode: ${{ github.event.inputs.build_type }}"
          echo "▶ Flutter: ${{ needs.detect.outputs.flutter_version }}"
          if [ -f "pubspec.yaml" ]; then
            flutter build apk \
              --${{ github.event.inputs.build_type }} \
              --no-pub \
              --suppress-analytics \
              --no-tree-shake-icons \
              2>&1 | tail -20
          else
            GRADLE_PATH=$(find . -name "gradlew" | head -n 1)
            if [ -z "$GRADLE_PATH" ]; then
              echo "❌ ERROR: gradlew tidak ditemukan!"
              exit 1
            fi
            GRADLE_DIR=$(dirname "$GRADLE_PATH")
            cd "$GRADLE_DIR"
            chmod +x gradlew
            if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
              ./gradlew assembleDebug \
                --parallel --build-cache --no-daemon \
                --configuration-cache 2>&1 | tail -20
            else
              ./gradlew assembleRelease \
                --parallel --build-cache --no-daemon \
                --configuration-cache 2>&1 | tail -20
            fi
          fi

      - name: Check APK Output
        run: |
          APK_FOUND=$(find $GITHUB_WORKSPACE -name "*.apk" | head -n 1)
          if [ -z "$APK_FOUND" ]; then
            echo "❌ APK tidak ditemukan."
            exit 1
          fi
          APK_REL=$(echo "$APK_FOUND" | sed "s|$GITHUB_WORKSPACE/||")
          echo "✅ APK: $APK_REL ($(du -sh "$APK_FOUND" | cut -f1))"
          echo "APK_PATH=$APK_REL" >> $GITHUB_ENV
          echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: ${{ env.PROJECT_DIR }}/${{ env.APK_PATH }}
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
